const authBtns=()=>['google','apple','x'].map(k=>'<button class="auth-btn '+k+'" data-auth="'+k+'">'+GLYPH[k]+'<span>Continue with '+PROV[k][0]+'</span></button>').join('');
function authNote(t){ for(const el of document.querySelectorAll('.auth-msg')) el.textContent=t||''; }
function authErr(e,k){
  const c=(e&&e.code)||'';
  if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request') return 'Sign-in cancelled.';
  if(c==='auth/operation-not-allowed') return PROV[k][0]+' sign-in is not turned on yet. In Firebase console > Authentication > Sign-in method, enable '+PROV[k][0]+'.';
  if(c==='auth/unauthorized-domain') return 'This website is not allowed yet. In Firebase console > Authentication > Settings > Authorized domains, add this domain.';
  if(c==='auth/account-exists-with-different-credential') return 'An account with this email already exists with another sign-in method. Use that one.';
  if(c==='auth/network-request-failed') return 'No internet connection.';
  return (e&&e.message)||'Sign-in failed. Try again.';
}
function authSignIn(kind){
  // OAuth providers cannot authenticate a file:// page (its origin is null).
  // Send local-file users to the real HTTPS deployment instead of leaving a dead button.
  if(location.protocol==='file:'){
    // OAuth requires a secure hosted origin. Replace this local-file page
    // with the Firebase Hosting site for the configured project.
    // Same-tab navigation avoids popup blockers and the noopener/null-tab issue.
    window.location.replace('https://chess-df5e6.web.app');
    return;
  }
  if(!window.firebase||!firebase.auth){ authNote('Sign-in needs an internet connection.'); return; }
  let prov;
  try{
    fbApp();
    if(kind==='google') prov=new firebase.auth.GoogleAuthProvider();
    else if(kind==='apple'){ prov=new firebase.auth.OAuthProvider('apple.com'); prov.addScope('email'); prov.addScope('name'); }
    else prov=new firebase.auth.OAuthProvider('twitter.com');
  }catch(e){ authNote('Could not start sign-in. Check your connection.'); return; }
  authNote('Opening '+PROV[kind][0]+'…');
  const a=firebase.auth();
  // Keep the authenticated session after the browser/app is closed and reopened.
  a.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(()=>a.signInWithPopup(prov)).then(()=>{
    authNote(''); if(!$('modal').hidden) closeModal();
  }).catch(e=>{
    if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){
      a.signInWithRedirect(prov).catch(err=>authNote(authErr(err,kind)));
      return;
    }
    authNote(authErr(e,kind));
  });
}
function authApply(){
  const u=AUTH.user, idle=!OL.room&&!FB.qLive;
  setTimeout(()=>{ if(typeof frStart==='function') frStart(); },0);
  if(u){
    if(idle) CID=u.uid;
    if(prefs.authUid!==u.uid){
      prefs.authUid=u.uid;
      const n=(u.displayName||(u.email||'').split('@')[0]||'').replace(/[<>&"]/g,'').trim().slice(0,20);
      if(n) prefs.name=n;
      persist();
    }
  } else if(idle) CID=GUEST_CID;
  $('profName').textContent=prefs.name||'Player';
  const lb=$('loginLbl'); if(lb) lb.textContent=u?'Account':'Sign in';
  if(page==='other') renderOther();
}

function openAccount(){

  if(u){
    const pid=(u.providerData&&u.providerData[0]&&u.providerData[0].providerId)||'';
    const pn=(Object.values(PROV).find(x=>x[1]===pid)||[pid])[0];

/* ---- particle engine ---- */
const fxc=$('fx'),fxx=fxc.getContext('2d');
const fxImg=new Image(); fxImg.src=COIN_IMG;
let FXP=[],fxRaf=0,fxLast=0,fxDpr=1;
function fxSize(){
  fxDpr=Math.min(2,window.devicePixelRatio||1);
  fxc.width=Math.round(innerWidth*fxDpr); fxc.height=Math.round(innerHeight*fxDpr);
  fxc.style.width=innerWidth+'px'; fxc.style.height=innerHeight+'px';
}
fxSize(); addEventListener('resize',fxSize);
function fxKick(){ if(!fxRaf){ fxLast=performance.now(); fxRaf=requestAnimationFrame(fxLoop); } }
function drawCoin(x,y,r,phase,alpha){
  let sx=Math.cos(phase); if(Math.abs(sx)<.14) sx=sx<0?-.14:.14;
  fxx.save(); fxx.translate(x,y); fxx.scale(sx,1); fxx.globalAlpha=alpha;
  if(fxImg.complete&&fxImg.naturalWidth) fxx.drawImage(fxImg,-r,-r,r*2,r*2);
  else{
    fxx.fillStyle='#b97f00'; fxx.beginPath(); fxx.arc(0,0,r,0,6.2832); fxx.fill();
    fxx.fillStyle='#F6BE00'; fxx.beginPath(); fxx.arc(0,0,r*.8,0,6.2832); fxx.fill();
  }
  fxx.restore();
}
function fxLoop(now){
  const dt=Math.min(.033,(now-fxLast)/1000||.016); fxLast=now;
  fxx.setTransform(fxDpr,0,0,fxDpr,0,0);
  fxx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=FXP.length-1;i>=0;i--){
    const p=FXP[i]; if(!p) continue;
    p.age+=dt; if(p.age<p.delay) continue;
    const t=p.age-p.delay;
    if(p.k==='fly'){
      const k=Math.min(1,t/p.dur), e=k*k*(3-2*k)*.65+k*.35, u=1-e;
      p.x=u*u*p.sx+2*u*e*p.cx+e*e*p.tx; p.y=u*u*p.sy+2*u*e*p.cy+e*e*p.ty;
      p.phase+=dt*13;
      drawCoin(p.x,p.y,p.r*(1-.4*e),p.phase,1);
      if(Math.random()<.55) FXP.push({k:'spark',x:p.x,y:p.y,vx:rnd(-30,30),vy:rnd(-30,30),g:0,age:0,delay:0,life:.35,r:rnd(1,2.2),c:'#ffe27a'});
      if(k>=1){ FXP.splice(i,1); if(p.done) p.done(); }
      continue;
    }
    if(t>p.life){ FXP.splice(i,1); continue; }
    const fade=Math.min(1,(p.life-t)/.35);
    if(p.k==='coin'){
      p.vy+=p.g*dt; p.vx*=.995; p.x+=p.vx*dt; p.y+=p.vy*dt; p.phase+=p.spin*dt;
      if(p.y>innerHeight+60){ FXP.splice(i,1); continue; }
      drawCoin(p.x,p.y,p.r,p.phase,fade);
    } else if(p.k==='spark'){
      p.vx*=.96; p.vy=p.vy*.97+p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      fxx.globalCompositeOperation='lighter'; fxx.globalAlpha=fade;
      const r=Math.max(.3,p.r*(.4+.6*fade));
      const gr=fxx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*3);
      gr.addColorStop(0,p.c); gr.addColorStop(1,'rgba(255,200,40,0)');
      fxx.fillStyle=gr; fxx.beginPath(); fxx.arc(p.x,p.y,r*3,0,6.2832); fxx.fill();
      fxx.globalCompositeOperation='source-over'; fxx.globalAlpha=1;
    } else if(p.k==='conf'){
      p.vy+=p.g*dt; p.vy*=.988; p.vx=p.vx*.99+Math.sin(t*4+p.sw)*10*dt*10; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
      if(p.y>innerHeight+30){ FXP.splice(i,1); continue; }
      fxx.save(); fxx.translate(p.x,p.y); fxx.rotate(p.rot); fxx.scale(1,Math.cos(t*7+p.sw)); fxx.globalAlpha=fade; fxx.fillStyle=p.c;
      fxx.fillRect(-p.w/2,-p.h/2,p.w,p.h); fxx.restore();
    } else if(p.k==='ring'){
      const k=t/p.life; fxx.globalAlpha=(1-k)*.9; fxx.strokeStyle=p.c; fxx.lineWidth=p.lw*(1-k)+1;
      fxx.beginPath(); fxx.arc(p.x,p.y,p.r0+(p.r1-p.r0)*(1-Math.pow(1-k,3)),0,6.2832); fxx.stroke(); fxx.globalAlpha=1;
    }
  }
  if(FXP.length) fxRaf=requestAnimationFrame(fxLoop);
  else{ fxRaf=0; fxx.clearRect(0,0,innerWidth,innerHeight); }
}
const GOLDS=['#fff6b8','#ffe27a','#F6BE00','#ffd54a','#ffffff'];
function fxBurst(x,y,n,o){
  if(reduceMotion) return; o=o||{};
  const cols=o.cols||GOLDS;
  for(let i=0;i<n;i++){
    const a=rnd(0,6.2832),sp=(o.min||60)+Math.random()*(o.sp||240);
    FXP.push({k:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:o.g==null?260:o.g,age:0,delay:o.delay||0,life:rnd(.4,.95),r:rnd(1.3,3.2),c:cols[(Math.random()*cols.length)|0]});
  }
  fxKick();
}
function fxRing(x,y,c,big){
  if(reduceMotion) return;
  FXP.push({k:'ring',x,y,r0:4,r1:big||60,lw:5,c:c||'#F6BE00',age:0,delay:0,life:.6}); fxKick();
}
function fxCoins(x,y,n,o){
  if(reduceMotion) return; o=o||{};
  for(let i=0;i<n;i++){
    const a=-1.5708+(Math.random()-.5)*(o.spread||1.8),sp=rnd(380,820);
    FXP.push({k:'coin',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:1250,phase:rnd(0,6),spin:rnd(8,18),r:rnd(11,19),age:0,delay:i*.012,life:rnd(1.6,2.6)});
  }
  fxKick();
}
function fxConfetti(n){
  if(reduceMotion) return;
  const cols=['#F6BE00','#ffe27a','#81b64c','#3aa0e0','#e5534b','#ffffff','#b98af0'];
  for(let i=0;i<n;i++) FXP.push({k:'conf',x:rnd(0,innerWidth),y:rnd(-240,-10),vx:rnd(-90,90),vy:rnd(60,220),g:rnd(160,260),w:rnd(6,11),h:rnd(10,18),rot:rnd(0,6),vr:rnd(-7,7),sw:rnd(0,6),c:cols[(Math.random()*cols.length)|0],age:0,delay:rnd(0,.7),life:rnd(2.4,4)});
  fxKick();
}
function fxFireworks(n){
  if(reduceMotion) return;
  for(let i=0;i<n;i++) setTimeout(()=>{
    const x=innerWidth*rnd(.12,.88),y=innerHeight*rnd(.12,.5);
    fxBurst(x,y,54,{sp:360,min:90,g:190}); fxRing(x,y,'#ffd54a',90);
    ding([880+i*90,1320]);

}
const ptOf=s=>{ if(Array.isArray(s)) return s; const r=s.getBoundingClientRect(); return [r.left+r.width/2,r.top+r.height/2]; };
function chipEl(){ for(const id of ['btnCoins','btnCoins2']){ const e=$(id); if(e&&e.getClientRects().length) return e; } return null; }
function fxFly(src,dst,n,onEnd){
  if(reduceMotion||!dst){ if(onEnd) onEnd(); return; }
  const [sx,sy]=ptOf(src),[tx,ty]=ptOf(dst);
  for(let i=0;i<n;i++){
    const last=i===n-1;
    FXP.push({k:'fly',sx:sx+rnd(-20,20),sy:sy+rnd(-20,20),tx,ty,cx:(sx+tx)/2+rnd(-170,170),cy:Math.min(sy,ty)-rnd(30,200),x:sx,y:sy,phase:rnd(0,6),r:rnd(11,17),age:0,delay:i*.05,dur:rnd(.75,1.1),
      done:()=>{ fxBurst(tx,ty,6,{sp:90,min:20,g:0}); if(i%4===0) fxRing(tx,ty,'#F6BE00',26); if(last&&onEnd) onEnd(); bumpChip(); }});
  }
  fxKick();
}
function bumpChip(){ for(const id of ['btnCoins','btnCoins2']){ const e=$(id); if(e){ e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); } } }
function goldFlash(){

  document.body.classList.add('shake'); setTimeout(()=>document.body.classList.remove('shake'),520);

/* chess move effects */
function fxMove(m,chk,ended,mover){
  if(reduceMotion||page==='community'||page==='other'||!G) return;
  const el=boardEl.querySelector('[data-sq="'+m.to+'"]'); if(!el) return;
  const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  const cols=mover==='w'?['#ffffff','#fff6b8','#eeeed2']:['#c9d1ff','#ffe27a','#9aa1b8'];
  setTimeout(()=>{
    if(m.cap){ fxBurst(x,y,24,{sp:230,cols}); fxRing(x,y,'rgba(255,230,140,1)',r.width*.9); }
    else fxBurst(x,y,5,{sp:70,min:20,g:0,cols});
    if(m.promo){ fxBurst(x,y,40,{sp:300}); fxRing(x,y,'#F6BE00',r.width*1.4); }
  },m.cap||m.promo?150:190);
  if(chk){
    const s=live(),k=boardEl.querySelector('[data-sq="'+kingOf(s,s.turn)+'"]');
    if(k){
      const kr=k.getBoundingClientRect(),kx=kr.left+kr.width/2,ky=kr.top+kr.height/2;
      setTimeout(()=>{ fxRing(kx,ky,'#ff5a4d',kr.width*1.2); fxBurst(kx,ky,16,{sp:200,cols:['#ff8a7a','#ff5a4d','#fff']}); },220);
      if(ended&&G.legal&&!G.legal.length){
        setTimeout(()=>{ fxRing(kx,ky,'#ff5a4d',kr.width*2.4); fxRing(kx,ky,'#ffd54a',kr.width*1.6); fxBurst(kx,ky,50,{sp:340}); document.body.classList.add('shake'); setTimeout(()=>document.body.classList.remove('shake'),520); },320);
      }
    }
  }
}
/* sounds */
function ding(seq){
  if(!prefs.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime;
    seq.forEach((f,i)=>{
      const o=actx.createOscillator(),g=actx.createGain(),t=t0+i*.07;
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.12,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+.38);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+.42);
    });
  }catch(e){}
}

/* ---- wallet ---- */
let shown=prefs.coins,tweenRaf=0,shopArm=null;
function paintBal(v){ const s=nf(v); for(const el of document.querySelectorAll('.coinNum,#coinBalBig,.cc-bal')) el.textContent=s; }
function tweenBal(delay){
  cancelAnimationFrame(tweenRaf);
  const from=shown,to=prefs.coins;
  if(reduceMotion||from===to){ shown=to; paintBal(to); return; }
  const dur=Math.min(1500,500+Math.abs(to-from)*.5),t0=performance.now()+(delay||0);
  const step=now=>{
    const k=Math.max(0,Math.min(1,(now-t0)/dur)),e=1-Math.pow(1-k,3);
    shown=from+(to-from)*e; paintBal(shown);
    if(k<1) tweenRaf=requestAnimationFrame(step); else{ shown=to; paintBal(to); }
  };
  tweenRaf=requestAnimationFrame(step);
}
function dailyInfo(){
  const d=prefs.cDaily,t=todayStr(),y=todayStr(new Date(Date.now()-864e5));
  const claimed=d.last===t;
  let cur=d.streak||0; if(!claimed&&d.last!==y) cur=0;
  const dayNum=claimed?cur:cur+1;
  const done=claimed?((cur-1)%7)+1:cur%7;
  return {claimed,cur,dayNum,done,idx:(dayNum-1)%7,amount:DAILY[(dayNum-1)%7]};
}
function mountChips(){
  for(const id of ['btnCoins','btnCoins2']){ const e=$(id); if(e) e.innerHTML=coinIco()+'<b class="coinNum">'+nf(shown)+'</b><span class="plus-b">+</span>'; }
  updateChips();
}
function updateChips(){
  const rdy=!dailyInfo().claimed;
  for(const id of ['btnCoins','btnCoins2']){ const e=$(id); if(e) e.classList.toggle('ready',rdy); }
}
function toast(msg){
  const box=$('toasts'); while(box.children.length>=3) box.firstChild.remove();
  const t=document.createElement('div'); t.className='toast'; t.innerHTML=coinIco()+'<span>'+esc(msg)+'</span>';
  t.onclick=()=>{ t.remove(); openCoins(); };
  box.appendChild(t); setTimeout(()=>t.remove(),3200);
}
function award(n,why,o){
  o=o||{}; n=Math.round(n); if(!(n>0)) return;
  prefs.coins+=n; prefs.cEarned+=n; persist();
  setTimeout(()=>{
    ding([988,1319]);
    const chip=chipEl(),from=o.from||boardEl;
    if(o.fountain&&from&&!reduceMotion){ const [fx_,fy_]=ptOf(from); fxCoins(fx_,fy_,Math.min(36,10+Math.round(n/60))); }
    if(chip&&from&&!reduceMotion){
      fxFly(from,chip,Math.min(16,5+Math.round(n/180)),null);
      tweenBal(700);
    } else tweenBal(0);
    toast('+'+nf(n)+' coins'+(why?' · '+why:''));
    updateChips();
  },o.delay||0);
}
function puzzleCoins(P){ return PUZ_COINS[P.n]||PUZ_COINS[2]; }
function coinGameEnd(g,result,outcome){
  try{
    if(g.coined||!g.ended) return; g.coined=true;
    const parts=[],n=g.moves.length;
    let won=false;
    if(g.mode==='ai'){
      const b=BOTS[g.bot];
      if(n>=14){
        if(outcome===1){ won=true; parts.push(['Victory',botWin(b)]); }
        else if(outcome===.5) parts.push(['Draw',Math.round(botWin(b)*.4)]);
      }
      if(outcome===0&&n>=24) parts.push(['Good fight',30]);
      if(won&&prefs.cFirst!==todayStr()){ prefs.cFirst=todayStr(); parts.push(['First win today',FIRST_WIN]); }
    } else if(g.mode==='online'&&g.human&&n>=10){
      const dr=result==='1/2-1/2';
      won=!dr&&((result==='1-0')===(g.human==='w'));
      parts.push([won?'Online win':dr?'Online draw':'Online game',won?ONLINE_REW.win:dr?ONLINE_REW.draw:ONLINE_REW.loss]);
    }
    const total=parts.reduce((a,p)=>a+p[1],0);
    g.ended.coins=total; g.ended.parts=parts;
    if(!total) return;
    award(total,parts[0][0]+(parts.length>1?' + bonus':''),{from:boardEl,delay:750,fountain:won});
    if(won){ setTimeout(()=>{ fxConfetti(90); fxFireworks(3); },650); }
  }catch(e){}
}

  try{

    if(!v){ v='g'+Math.random().toString(36).slice(2,12)+Math.random().toString(36).slice(2,6); localStorage.setItem('srb-guest-id',v); }
    return v;
  }catch(e){ return 'g'+TAB+'x'; }
}
const frMe=()=>AUTH.user?AUTH.user.uid:frGuestId();
const frPair=fid=>[FR.id,fid].sort().join('_');
const frTcLabel=tc=>{ const t=parseTC(tc); return t?(Math.round(t.base/60)+' min'+(t.inc?' + '+t.inc+' s':'')):'no clock'; };
function frDbGet(){
  if(!window.firebase||!firebase.database) return null;
  try{ return fbDb(); }catch(e){ return null; }
}
function frToast(msg,fn){
  const box=$('toasts'); while(box.children.length>=3) box.firstChild.remove();
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML='<span class="tico">'+IC.friends+'</span><span>'+esc(msg)+'</span>';
  t.onclick=()=>{ t.remove(); if(fn) fn(); };
  box.appendChild(t); setTimeout(()=>t.remove(),3200);
}
function frNote(t){ FR.msg=t||''; const el=$('frMsg'); if(el) el.textContent=FR.msg; }
function frCopy(text){
  const ok=()=>frToast('Copied');
  const fb=()=>{ try{ const t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); const r=document.execCommand('copy'); t.remove(); if(r) ok(); else frToast('Copy: '+text); }catch(e){ frToast('Copy: '+text); } };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok,fb); else fb();
}
const frLastRead=()=>{ try{ return JSON.parse(localStorage.getItem('srb-dmread-'+FR.id))||{}; }catch(e){ return {}; } };
function frMarkRead(fid){
  try{ const o=frLastRead(); o[fid]=fbNow(); localStorage.setItem('srb-dmread-'+FR.id,JSON.stringify(o)); }catch(e){}
  if(FR.unread[fid]){ delete FR.unread[fid]; frBadge(); }
}
function frSyncProfile(){
  if(!FR.db||!FR.id) return;
  FR.db.ref('users/'+FR.id).update({name:prefs.name||'Player',flag:prefs.country||'',at:fbNow()}).catch(()=>{});
}
function frMakeCode(n){
  const db=FR.db,id=FR.id; if(!db) return;
  const c=Array.from({length:6},()=>CODE_CH[(Math.random()*CODE_CH.length)|0]).join('');
  db.ref('codes/'+c).transaction(cur=>cur===null?id:undefined,(err,ok)=>{
    if(err){ FR.denied=true; frRefresh(); return; }
    if(!ok){ if(n<6) frMakeCode(n+1); return; }
    db.ref('users/'+id+'/code').set(c); FR.code=c; frRefresh();
  },false);
}
function frStop(){
  for(const f of FR.unsub){ try{ f(); }catch(e){} }
  for(const k of Object.keys(FR.fl)) for(const f of FR.fl[k]){ try{ f(); }catch(e){} }
  FR.unsub=[]; FR.fl={}; frDetachChat();
  FR.db=null; FR.id=''; FR.code=''; FR.friends={}; FR.reqs={}; FR.invs={}; FR.pres={}; FR.prof={}; FR.unread={}; FR.chatWith=null; FR.reqInit=false; FR.denied=false; FR.out={};
}
function frStart(){
  const id=frMe();
  if(FR.db&&FR.id===id) return;
  frStop();
  const db=frDbGet();
  if(!db){ frRefresh(); return; }
  FR.db=db; FR.id=id; FR.t0=Date.now();
  const on=(ref,fn)=>{
    ref.on('value',fn,()=>{ FR.denied=true; frRefresh(); });
    FR.unsub.push(()=>ref.off('value',fn));
  };
  /* online presence: one child per open tab, removed automatically on disconnect */
  const conn=db.ref('.info/connected'),me=db.ref('presence/'+id+'/'+TAB);
  const cf=s=>{ if(s.val()===true){ me.onDisconnect().remove(); me.set(true); } };
  conn.on('value',cf);
  FR.unsub.push(()=>{ conn.off('value',cf); try{ me.onDisconnect().cancel(); }catch(e){} me.remove().catch(()=>{}); });
  frSyncProfile();
  db.ref('users/'+id+'/code').once('value',s=>{ const c=s.val(); if(c){ FR.code=c; frRefresh(); } else frMakeCode(0); },()=>{ FR.denied=true; frRefresh(); });
  on(db.ref('friends/'+id),s=>{ FR.friends=s.val()||{}; frWatchFriends(); frBadge(); frRefresh(); });
  on(db.ref('requests/'+id),s=>{
    const nv=s.val()||{};
    if(FR.reqInit) for(const k of Object.keys(nv)) if(!FR.reqs[k]) frToast((nv[k].name||'Someone')+' sent you a friend request',()=>{ setPage('community'); });
    FR.reqs=nv; FR.reqInit=true; frBadge(); frRefresh();
  });
  on(db.ref('invites/'+id),s=>{
    FR.invs=s.val()||{};
    for(const from of Object.keys(FR.invs)){
      const inv=FR.invs[from],k=from+':'+inv.room;
      if(FR.seenInv[k]||fbNow()-(inv.at||0)>300000) continue;
      FR.seenInv[k]=1; frInviteNotify(from,inv);
    }
    frBadge(); frRefresh();
  });
  if(FR.pendingAdd){ const c=FR.pendingAdd; FR.pendingAdd=null; setTimeout(()=>frAddByCode(c,true),900); }
  frRefresh();
}
function frWatchFriends(){
  const db=FR.db; if(!db) return;
  for(const fid of Object.keys(FR.fl)) if(!FR.friends[fid]){
    for(const f of FR.fl[fid]){ try{ f(); }catch(e){} }
    delete FR.fl[fid]; delete FR.prof[fid]; delete FR.pres[fid]; delete FR.unread[fid];
  }
  for(const fid of Object.keys(FR.friends)){
    if(FR.fl[fid]) continue;
    const un=[],pf=db.ref('users/'+fid),pr=db.ref('presence/'+fid),dm=db.ref('dm/'+frPair(fid)).limitToLast(1);
    const f1=s=>{ FR.prof[fid]=s.val()||{}; frRefresh(); };
    const f2=s=>{ FR.pres[fid]=s.exists(); frRefresh(); };
    const f3=s=>{
      const m=s.val(); if(!m||m.f===FR.id) return;
      if(m.t>(frLastRead()[fid]||0)&&FR.chatWith!==fid){
        FR.unread[fid]=true; frBadge(); frRefresh();
        if(fbNow()-m.t<8000) frToast(((FR.prof[fid]||{}).name||'Friend')+': '+String(m.x).slice(0,40),()=>frOpenChat(fid));
      }
    };
    pf.on('value',f1); un.push(()=>pf.off('value',f1));
    pr.on('value',f2); un.push(()=>pr.off('value',f2));
    dm.on('child_added',f3); un.push(()=>dm.off('child_added',f3));
    FR.fl[fid]=un;
  }
}
function frFresh(inv){ return inv&&fbNow()-(inv.at||0)<300000; }
function frBadge(){
  const n=Object.keys(FR.reqs).length+Object.keys(FR.invs).filter(k=>frFresh(FR.invs[k])).length+Object.keys(FR.unread).length;
  for(const id of ['frBadge','frNavBadge']){ const e=$(id); if(e){ e.hidden=!n; e.textContent=n>9?'9+':String(n); } }
}

/* friend requests */
function frRequest(fid,name,fl){
  if(!FR.db){ frToast('Friends need an internet connection.'); return; }
  if(fid===FR.id){ frNote('That is you.'); return; }
  if(FR.friends[fid]){ frToast('You are already friends with '+name+'.'); return; }
  if(FR.reqs[fid]){ frAcceptReq(fid); return; }
  FR.db.ref('requests/'+fid+'/'+FR.id).set({name:prefs.name||'Player',flag:prefs.country||'',code:FR.code,at:fbNow()})
    .then(()=>{ frToast('Friend request sent to '+name); frNote('Request sent to '+name+'.'); })
    .catch(()=>frToast('Could not send. Publish the updated database rules.'));
}
function frAddByCode(raw,confirmFirst){
  if(!FR.db){ frToast('Friends need an internet connection.'); return; }
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6){ frNote('Friend codes have 6 letters or digits.'); return; }
  frNote('Looking up '+code+'…');
  FR.db.ref('codes/'+code).once('value',s=>{
    const id=s.val();
    if(!id){ frNote('No player has that code.'); return; }
    if(id===FR.id){ frNote('That is your own code.'); return; }
    if(FR.friends[id]){ frNote('You are already friends.'); return; }
    FR.db.ref('users/'+id).once('value',u=>{
      const p=u.val()||{},nm=p.name||'Player';
      const go=()=>frRequest(id,nm,p.flag||'');
      if(confirmFirst){
        openModal('<h2>Add friend</h2><p style="margin:0">Send a friend request to <b>'+esc(nm)+'</b>?</p><button class="cta sm" id="frGo">Send request</button><button class="btn x" data-close>Cancel</button>');
        $('frGo').onclick=()=>{ closeModal(); go(); };
      } else go();
    });
  },()=>frNote('Could not reach the database.'));
}
function frAcceptReq(fid){
  const t=fbNow(),up={};
  up['friends/'+FR.id+'/'+fid]={at:t}; up['friends/'+fid+'/'+FR.id]={at:t};
  up['requests/'+FR.id+'/'+fid]=null; up['requests/'+fid+'/'+FR.id]=null;
  FR.db.ref().update(up).then(()=>frToast('You are now friends')).catch(()=>frToast('Could not accept. Publish the updated database rules.'));
}
function frDeclineReq(fid){ FR.db.ref('requests/'+FR.id+'/'+fid).remove(); }
function frRemove(fid){
  const up={}; up['friends/'+FR.id+'/'+fid]=null; up['friends/'+fid+'/'+FR.id]=null;
  FR.db.ref().update(up).catch(()=>{});
  if(FR.chatWith===fid) frCloseChat();
}
function frAddFromGame(){
  const v=FB.snap&&FB.snap.val(),p=v&&v.players&&v.players[otherCol(OL.you)];
  if(!p||!p.fid){ frToast('That player cannot be added.'); return; }
  frRequest(p.fid,p.name||'Player',p.flag||'');
}

/* direct messages */
function frDetachChat(){ if(FR.chatUnsub){ try{ FR.chatUnsub(); }catch(e){} FR.chatUnsub=null; } FR.chatSeen=null; }
function frCloseChat(){ FR.chatWith=null; frDetachChat(); frRefresh(); }
function frOpenChat(fid){

}
function frAppendMsg(key,m){
  const box=$('frMsgs'); if(!box||(FR.chatSeen&&FR.chatSeen.has(key))) return;

function frChatHead(){
