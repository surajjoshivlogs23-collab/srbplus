<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SRB+ Chess</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Poppins:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout concept: chess.com-style shell. Left nav rail, board with player bars in the middle, a right panel that changes per section (bots, puzzles, lessons, review, watch). Phones get a bottom tab bar and a stacked panel. */
:root{
  --font-body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-disp:'Poppins','Nunito Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#262522; --side:#1f1e1c; --panel:#2b2a27; --head:#1f1e1c; --card:#34322f; --card2:#44413d; --line:#3d3b37;
  --ink:#f3f1ed; --muted:#a7a49e; --logo-ink:#ffffff; --cut:#1f1e1c;
  --gold:#F6BE00; --green:#81b64c; --green-d:#5d8a33; --green-ink:#ffffff; --good:#81b64c; --bad:#e5534b;
  --evdark:#161513; --evlight:#f1f1ec;
  --sq-l:#eeeed2; --sq-d:#769656; --hl-l:#f6f669; --hl-d:#bbcb2b; --dot:rgba(0,0,0,.2);
  --wf:#FAFAF5; --ws:#1D1D1D; --wd:#1D1D1D; --bf:#2C2C2C; --bs:#050505; --bd:#DADAD2;
  --graph-w:#ECECE6; --graph-b:#1B1B1B; --bubble:#ffffff; --bubble-ink:#262522;
  --shadow:0 2px 6px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#ecebe7; --side:#ffffff; --panel:#ffffff; --head:#f4f3ef; --card:#f1f0ec; --card2:#e1dfd9; --line:#dcdad4;
    --ink:#1f1e1c; --muted:#6a6761; --logo-ink:#1f1e1c; --cut:#ffffff;
    --green:#5f9a2f; --green-d:#477a20; --bubble:#efede8; --bubble-ink:#1f1e1c;
    --shadow:0 2px 6px rgba(0,0,0,.12); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#ecebe7; --side:#ffffff; --panel:#ffffff; --head:#f4f3ef; --card:#f1f0ec; --card2:#e1dfd9; --line:#dcdad4;
  --ink:#1f1e1c; --muted:#6a6761; --logo-ink:#1f1e1c; --cut:#ffffff;
  --green:#5f9a2f; --green-d:#477a20; --bubble:#efede8; --bubble-ink:#1f1e1c;
  --shadow:0 2px 6px rgba(0,0,0,.12); color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg{display:block}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px 16px max(16px,env(safe-area-inset-left,0px));gap:6px}
.side .logo{height:34px;width:auto;margin:6px 0 18px 4px}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:14px;padding:9px 12px;border:0;background:transparent;font:700 19px/1.1 var(--font-disp);border-radius:8px;text-align:left;color:var(--ink)}
.nav button:hover{background:var(--card)}
.nav button[aria-current="page"]{background:var(--card2)}
.nav svg{width:30px;height:30px;flex:none}
.nav .l-short{display:none}
.side-foot{margin-top:auto;display:grid;gap:10px;padding-top:18px}
.srch{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--muted);font:700 17px/1 var(--font-disp);padding:8px 12px;border-radius:8px;text-align:left}
.srch:hover{background:var(--card)}
.prof{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:6px 8px;border-radius:8px;text-align:left}
.prof:hover{background:var(--card)}
.prof .pav{width:36px;height:36px;border-radius:4px;overflow:hidden;flex:none}
.prof .pav svg{width:100%;height:100%}
.prof b{font:700 16px/1.1 var(--font-disp);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sicons{display:flex;justify-content:space-between;padding:4px 6px}
.sicons button{position:relative;border:0;background:transparent;color:var(--muted);padding:6px;border-radius:8px}
.sicons button:hover{background:var(--card);color:var(--ink)}
.sicons svg{width:26px;height:26px}
.badge-n{position:absolute;top:0;right:0;min-width:17px;height:17px;border-radius:9px;background:#e53935;color:#fff;font:800 11px/17px var(--font-body);text-align:center;padding:0 4px}

/* main */
.main{min-width:0;padding:22px max(16px,env(safe-area-inset-right,0px)) 40px 28px}
.mhead{display:none;align-items:center;justify-content:space-between;margin-bottom:12px}
.mhead .logo{height:30px;width:auto}
.stagewrap{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:26px;align-items:start}
.stage{width:100%;max-width:670px;min-width:0;justify-self:center}

/* player bars */
.player{display:flex;align-items:center;gap:12px;padding:8px 0;min-height:60px}
.avatar{width:46px;height:46px;border-radius:5px;overflow:hidden;flex:none;background:var(--sq-d);display:grid;place-items:center}
.avatar>svg{width:100%;height:100%}
.avatar>svg.pc{width:36px;height:36px}
.pinfo{min-width:0}
.pname{display:flex;align-items:center;gap:6px;font:700 16px/1.2 var(--font-body);white-space:nowrap}
.pname b{overflow:hidden;text-overflow:ellipsis;font-weight:800}
.prat{color:var(--muted);font-weight:600}
.flag{width:20px;height:14px;border-radius:2px;flex:none}
.pcaps{display:flex;align-items:center;gap:8px;min-height:22px;color:var(--muted);font-size:12px;font-weight:700}
.capg{display:flex;align-items:center}
.capg svg{width:20px;height:20px;margin-right:-8px}
.capg svg:last-child{margin-right:0}
.clock{margin-left:auto;font:700 22px/1 var(--font-mono);padding:10px 14px;background:var(--head);color:var(--muted);border-radius:5px;min-width:98px;text-align:right;font-variant-numeric:tabular-nums}
.clock.active{background:var(--card2);color:var(--ink)}
.clock.low{background:var(--bad);color:#fff}

/* board */
.board-wrap{display:flex;gap:8px;align-items:stretch}
.evalbar{width:22px;flex:none;border-radius:3px;background:var(--evdark);position:relative;overflow:hidden}
.ev-fill{position:absolute;left:0;right:0;bottom:0;height:50%;background:var(--evlight);transition:height .45s ease}
.board-wrap.flip .ev-fill{bottom:auto;top:0}
.board-box{position:relative;flex:1;min-width:0}
#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;width:100%;border-radius:3px;overflow:hidden;touch-action:none;container-type:inline-size;user-select:none;-webkit-user-select:none}
#board[data-theme="brown"]{--sq-l:#f0d9b5;--sq-d:#b58863;--hl-l:#f7ec74;--hl-d:#dac34b}
#board[data-theme="blue"]{--sq-l:#dee3e6;--sq-d:#8ca2ad;--hl-l:#d6e87a;--hl-d:#9fbf5e}
#board[data-theme="gray"]{--sq-l:#e4e4e0;--sq-d:#8e8e89;--hl-l:#f2f08a;--hl-d:#b9b44f}
.sq{position:relative;display:grid;place-items:center;background:var(--sq-l);cursor:pointer}
.sq.d{background:var(--sq-d)}
.sq.last.l,.sq.sel.l{background:var(--hl-l)}
.sq.last.d,.sq.sel.d{background:var(--hl-d)}
.nohl .sq.last.l{background:var(--sq-l)}
.nohl .sq.last.d{background:var(--sq-d)}
.sq::before{content:"";position:absolute;inset:0;pointer-events:none}
.sq.hint::before{background:rgba(30,150,235,.55)}
.sq.chk::before{background:radial-gradient(circle,rgba(235,40,40,.95) 0%,rgba(235,40,40,.55) 45%,rgba(235,40,40,0) 76%)}
.sq.tgt::after{content:"";position:absolute;inset:0;margin:auto;width:32%;height:32%;border-radius:50%;background:var(--dot);z-index:1;pointer-events:none}
.sq.tgt.cap::after{width:94%;height:94%;background:transparent;border:5px solid var(--dot)}
.co{position:absolute;font:800 clamp(8px,2.2cqw,14px)/1 var(--font-body);z-index:3;pointer-events:none}
.co.rk{top:5%;left:6%}
.co.fl{bottom:4%;right:6%}
.sq.l .co{color:var(--sq-d)}
.sq.d .co{color:var(--sq-l)}
.nocoords .co{display:none}
.pw{--pf:var(--wf);--ps:var(--ws);--pd:var(--wd)}
.pbk{--pf:var(--bf);--ps:var(--bs);--pd:var(--bd)}
.sq .pc{position:relative;z-index:2;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 1.5px 1.2px rgba(0,0,0,.32))}
.sq .pc.dragging{opacity:.3}
.sq .badge{position:absolute;z-index:4;top:2%;right:2%;width:24%;height:24%;min-width:14px;min-height:14px;border-radius:50%;display:grid;place-items:center;font:800 clamp(8px,2.4cqw,13px)/1 var(--font-body);color:#fff;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.ghost{position:fixed;left:0;top:0;z-index:999;pointer-events:none;filter:drop-shadow(0 10px 10px rgba(0,0,0,.4))}
.ghost svg{width:100%;height:100%}
.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(10,10,9,.6);padding:16px}
.modal-card{background:var(--panel);color:var(--ink);border-radius:12px;padding:22px 20px;box-shadow:0 10px 40px rgba(0,0,0,.5);width:min(100%,340px);display:grid;gap:12px;text-align:center}
.modal-card h3{margin:0;font:700 28px/1.1 var(--font-disp)}
.modal-card p{margin:0;color:var(--muted)}
.promo-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.promo-row button{aspect-ratio:1;border:0;background:var(--sq-l);cursor:pointer;padding:4px;border-radius:6px}
.promo-row button:hover{background:var(--hl-l)}
.promo-row svg{width:100%;height:100%}

/* right panel */
.rpanel{background:var(--panel);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.rp-head{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--head);padding:16px;min-height:70px}
.rp-head h1{margin:0;font:700 24px/1 var(--font-disp)}
.rp-ico svg{width:36px;height:36px}
.rp-body{display:flex;flex-direction:column;min-width:0}
.rp-body>section{min-width:0}
.cta{display:block;width:100%;border:0;background:var(--green);color:var(--green-ink);font:800 26px/1 var(--font-disp);padding:18px 16px 16px;border-radius:10px;box-shadow:0 5px 0 var(--green-d);text-align:center}
.cta:hover:not(:disabled){filter:brightness(1.07)}
.cta:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--green-d)}
.cta.sm{font-size:18px;padding:12px 14px 11px;box-shadow:0 4px 0 var(--green-d)}
.cta:disabled,.btn:disabled,.act:disabled,.ibtn:disabled{opacity:.4;cursor:not-allowed}
.btn{border:0;background:var(--card2);color:var(--ink);font:700 15px/1 var(--font-body);padding:12px 14px;border-radius:8px}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn.warn{color:var(--bad)}
.btnrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;padding:0 18px 16px}
.pad{padding:16px 18px}
.note{color:var(--muted);font-size:13px;margin:0}

/* play: setup */
.botlist{display:grid;padding:8px 10px 4px;gap:4px}
.botrow{display:flex;align-items:center;gap:12px;border:2px solid transparent;background:transparent;border-radius:10px;padding:8px 10px;text-align:left;width:100%}
.botrow:hover{background:var(--card)}
.botrow.sel{background:var(--card);border-color:var(--green)}
.botrow .av{width:52px;height:52px;border-radius:6px;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--card2)}
.botrow .av svg{width:100%;height:100%}
.botrow .bi{display:grid;gap:2px;min-width:0}
.botrow .bi b{font:800 17px/1.2 var(--font-body);display:flex;align-items:center;gap:6px}
.botrow .bi i{font-style:normal;color:var(--muted);font-weight:600}
.botrow .bi small{color:var(--muted);font-size:13px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px}
.setrow>label,.setrow>span.lbl{font-weight:700;color:var(--muted)}
.seg{display:flex;gap:6px}
.seg button{width:56px;height:46px;border:2px solid transparent;border-radius:8px;background:var(--card);display:grid;place-items:center;padding:0;font:800 20px/1 var(--font-disp);color:var(--ink)}
.seg button[aria-pressed="true"]{border-color:var(--green)}
.seg button svg{width:34px;height:34px}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);font-weight:600;font-size:14px;min-width:0;max-width:100%}
.setup-cta{padding:12px 18px 20px}

/* play: in-game */
.bubble-area{display:flex;align-items:center;gap:14px;padding:26px 18px 14px;min-height:180px}
.b-av{width:96px;height:96px;flex:none;border-radius:14px;overflow:hidden}
.b-av svg{width:100%;height:100%}
.bubble{position:relative;background:var(--bubble);color:var(--bubble-ink);border-radius:18px;padding:16px 18px;font:700 19px/1.3 var(--font-body);min-width:0;overflow-wrap:anywhere}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-left:0;border-right-color:var(--bubble)}
.gstatus{padding:0 18px 14px;color:var(--muted);font-weight:700;min-height:32px}
.openrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid var(--line);color:var(--muted);font-weight:700}
.openrow .oicons{display:flex;gap:6px}
.openrow button{border:0;background:transparent;color:var(--muted);padding:4px;border-radius:6px}
.openrow button:hover{color:var(--ink);background:var(--card)}
.openrow svg{width:26px;height:26px}
.moves{padding:6px 10px;min-height:96px;max-height:230px;overflow:auto;display:grid;align-content:start;border-top:1px solid var(--line);font:700 15px/1 var(--font-body)}
.moves .empty{color:var(--muted);padding:10px 8px;font-weight:600}
.mrow{display:grid;grid-template-columns:44px 1fr 1fr;align-items:center;padding:2px 0}
.mrow:nth-child(odd){background:rgba(127,127,127,.08)}
.mn{color:var(--muted);padding-left:8px}
.mv{background:none;border:0;text-align:left;padding:7px 8px;border-radius:4px;font:inherit;color:var(--ink);display:flex;align-items:center;gap:6px}
.mv:hover{background:var(--card)}
.mv.cur{background:var(--card2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted);display:inline-block}
.l-best,.l-excellent{--lc:#81b64c}.l-good{--lc:#8fa38f}.l-book{--lc:#b98a4a}.l-inaccuracy{--lc:#e8c13a}.l-mistake{--lc:#f08a2e}.l-blunder{--lc:#e5534b}
.dot[class*="l-"]{background:var(--lc)}
.navs{display:flex;justify-content:center;gap:8px;padding:8px 18px;border-top:1px solid var(--line)}
.ibtn{width:56px;height:34px;border-radius:6px;border:0;background:var(--card);display:grid;place-items:center;padding:0;color:var(--ink)}
.ibtn:hover:not(:disabled){background:var(--card2)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 18px 6px}
.act{height:70px;background:var(--card);border:0;border-radius:10px;color:var(--ink);display:grid;place-items:center;padding:0}
.act:hover:not(:disabled){background:var(--card2)}
.act svg{width:32px;height:32px}
.act.armed{background:var(--bad);color:#fff}
.minirow{display:flex;gap:8px;padding:8px 18px 4px;flex-wrap:wrap}
.mini{border:0;background:transparent;color:var(--muted);padding:6px;border-radius:8px}
.mini:hover{color:var(--ink);background:var(--card)}
.mini svg{width:30px;height:30px}
.movein{display:flex;gap:8px;padding:6px 18px 18px}
.movein input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}

/* puzzles, learn, review, watch */
.pz-title{font:800 26px/1.1 var(--font-disp)}
.pz-sub{color:var(--muted);margin-top:4px;font-weight:600}
.pz-dots{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 12px}
.pz-dots button{width:26px;height:26px;border:0;background:var(--card);padding:0;font:700 11px/1 var(--font-mono);color:var(--muted);border-radius:4px}
.pz-dots button.done{background:var(--green);color:#fff}
.pz-dots button.now{outline:2px solid var(--gold);outline-offset:1px}
.lessons{display:grid;gap:6px;padding:12px 14px;max-height:360px;overflow:auto}
.lesson{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:var(--card);padding:12px 14px;border-radius:8px;text-align:left;width:100%}
.lesson:hover{background:var(--card2)}
.lesson b{display:block;font-weight:800}
.lesson small{color:var(--muted)}
.ideas{display:grid;gap:8px;padding:0 14px 16px}
.idea{background:var(--card);border-radius:8px;padding:10px 12px;font-size:14px}
.idea b{display:block;margin-bottom:2px}
.bar{height:10px;background:var(--card);border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px 6px}
.acc div{background:var(--card);padding:10px 12px;border-radius:8px;display:grid;gap:2px}
.acc b{font:800 28px/1 var(--font-disp)}
.acc span{font-size:12px;color:var(--muted);font-weight:700}
#rvGraph{width:calc(100% - 36px);margin:8px 18px;height:90px;display:block;border-radius:6px;cursor:pointer;background:var(--graph-b)}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;padding:6px 18px}
.counts .row{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600}
.counts .row b{margin-left:auto;color:var(--ink);font-family:var(--font-mono)}
.rv-note{margin:8px 18px;padding:10px 12px;background:var(--card);border-radius:8px;font-size:14px;min-height:44px}
/* AI coach */
.coach{margin:10px 18px 4px;background:var(--card);border-radius:12px;padding:12px;display:grid;gap:10px}
.co-head{display:flex;align-items:center;gap:10px}
.co-av{width:48px;height:48px;border-radius:50%;overflow:hidden;flex:none;position:relative;box-shadow:0 0 0 2px var(--line)}
.co-av svg{width:100%;height:100%}
.co-av.speaking{box-shadow:0 0 0 3px var(--green);animation:coPulse 1.1s ease-in-out infinite}
@keyframes coPulse{0%,100%{box-shadow:0 0 0 3px var(--green),0 0 0 3px rgba(129,182,76,.5)}50%{box-shadow:0 0 0 3px var(--green),0 0 0 10px rgba(129,182,76,0)}}
.co-id{display:grid;gap:1px;min-width:0;flex:1}
.co-id b{font:700 16px/1.2 var(--font-disp)}
.co-id small{color:var(--muted);font-weight:700;font-size:12px}
.co-bubble{background:var(--bubble);color:var(--bubble-ink);border-radius:12px;padding:12px 14px;font:700 15px/1.45 var(--font-body);min-height:72px;max-height:190px;overflow:auto;overflow-wrap:anywhere}
.co-bubble:empty::before{content:"Press Game summary and I will talk you through this game.";font-weight:600;opacity:.6}
.co-bubble.typing::after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-2px;background:currentColor;animation:coCaret .8s steps(1) infinite}
@keyframes coCaret{50%{opacity:0}}
.co-chips{display:flex;flex-wrap:wrap;gap:6px}
.co-chips button{border:0;background:var(--card2);color:var(--ink);font:700 13px/1 var(--font-body);padding:9px 11px;border-radius:999px}
.co-chips button:hover{filter:brightness(1.15)}
.co-set{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:700}
.co-set select{padding:6px 8px;font-size:13px;max-width:100%}
.co-set .btn{padding:8px 11px;font-size:13px}
.co-set .switch{gap:6px}.co-set .switch input{width:16px;height:16px}
@media (prefers-reduced-motion:reduce){.co-av.speaking,.co-bubble.typing::after{animation:none}}
.evalrow{display:flex;justify-content:space-between;align-items:center;padding:6px 18px;color:var(--muted);font-weight:700}
.mono{font-family:var(--font-mono);font-weight:700;color:var(--ink)}
.ls-detail h2{margin:0;font:700 22px/1.2 var(--font-disp)}
.ls-detail p{margin:6px 0 0;color:var(--muted)}

/* pages: community and settings */
.page{max-width:900px;margin:0 auto;display:grid;gap:18px}
.page h1{margin:0;font:700 30px/1.1 var(--font-disp)}
.pcard{background:var(--panel);border-radius:10px;padding:18px;box-shadow:var(--shadow);min-width:0}
.pcard h2{margin:0 0 12px;font:700 19px/1.2 var(--font-disp)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border-radius:8px;padding:12px 14px;display:grid;gap:2px}
.stat b{font:800 28px/1 var(--font-disp)}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tbl tr.me td{background:rgba(129,182,76,.14);font-weight:800}
.tbl .who{display:flex;align-items:center;gap:10px}
.tbl .who span.av{width:32px;height:32px;border-radius:5px;overflow:hidden;flex:none}
.tbl .who span.av svg{width:100%;height:100%}
.tablewrap{overflow-x:auto}
.form{display:grid;gap:14px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.frow label{font-weight:700}
.frow input[type=text]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0;width:min(100%,220px)}
.switch{display:flex;align-items:center;gap:10px}
.switch input{accent-color:var(--green);width:20px;height:20px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:56px;height:56px;border:3px solid transparent;border-radius:8px;padding:0;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.swatches button[aria-pressed="true"]{border-color:var(--gold)}
.swatches i{display:block}

/* dialogs */
.dlg-back{position:fixed;inset:0;z-index:100;background:rgba(8,8,7,.65);display:grid;place-items:center;padding:16px}
.dlg{background:var(--panel);color:var(--ink);border-radius:12px;padding:20px;width:min(100%,460px);max-height:86vh;overflow:auto;box-shadow:0 14px 50px rgba(0,0,0,.55);display:grid;gap:12px}
.dlg h2{margin:0;font:700 22px/1.2 var(--font-disp)}
.dlg textarea{width:100%;min-height:110px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.4 var(--font-mono);color:var(--ink);resize:vertical}
.dlg .x{justify-self:end}
.srch-in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:16px}
.srch-list{display:grid;gap:4px}
.srch-list button{border:0;background:transparent;text-align:left;padding:10px;border-radius:8px;display:flex;justify-content:space-between;gap:10px}
.srch-list button:hover{background:var(--card)}
.srch-list small{color:var(--muted)}

@media (max-width:1060px){.stagewrap{grid-template-columns:minmax(0,1fr) 360px;gap:20px}.main{padding-left:20px}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;right:0;bottom:0;z-index:60;flex-direction:row;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);gap:0}
  .side .logo,.side-foot{display:none}
  .nav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:100%;gap:0}
  .nav button{flex-direction:column;gap:3px;font:700 10px/1.1 var(--font-body);padding:6px 0;align-items:center;justify-content:center;text-align:center;min-width:0}
  .nav svg{width:26px;height:26px}
  .nav .l-long{display:none}.nav .l-short{display:inline}
  .main{padding:12px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px))}
  .mhead{display:flex}
  .stagewrap{grid-template-columns:minmax(0,1fr)}
  .stage{max-width:none}
}
@media (max-width:520px){
  .clock{font-size:19px;min-width:84px;padding:9px 10px}
  .avatar{width:40px;height:40px}
  .avatar>svg.pc{width:30px;height:30px}
  .b-av{width:78px;height:78px}
  .bubble{font-size:17px}
  .evalbar{width:14px}
  .cta{font-size:22px}
}
@media (prefers-reduced-motion:reduce){.ev-fill,.bar i{transition:none}}

/* logo intro */
#intro{position:fixed;inset:0;z-index:1000;background:#1f1e1c;display:grid;place-content:center;justify-items:center;gap:26px;animation:introOut .55s ease 2.6s forwards;cursor:pointer}
#intro.skip{animation:introOut .3s ease forwards}
#intro svg{width:min(78vw,520px);height:auto;overflow:visible;display:block}
#intro .i-k,#intro .i-w,#intro .i-p,#intro .i-c{transform-box:fill-box}
#intro .i-k{transform-origin:50% 100%;animation:kIn .85s cubic-bezier(.2,.9,.25,1.25) .15s both}
#intro .i-w{animation:wIn .7s cubic-bezier(.2,.8,.2,1) .7s both}
#intro .i-p{transform-origin:50% 50%;animation:pIn .6s cubic-bezier(.2,1.6,.4,1) 1.25s both}
#intro .i-c{animation:wIn .6s ease 1.45s both}
#intro .i-bar{width:min(46vw,200px);height:3px;background:#3b3935;border-radius:2px;overflow:hidden}
#intro .i-bar i{display:block;height:100%;background:#F6BE00;animation:barGo 2.3s cubic-bezier(.4,0,.2,1) .2s both}
@keyframes kIn{from{opacity:0;transform:translateY(30px) scale(.55) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes wIn{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes pIn{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:none}}
@keyframes barGo{from{width:0}to{width:100%}}
@keyframes introOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#intro .i-k,#intro .i-w,#intro .i-p,#intro .i-c,#intro .i-bar i{animation:none}#intro{animation-delay:1s}}

.nav button{position:relative}
.nav-badge{top:2px;right:calc(50% - 22px)}

.toast .tico svg{width:22px;height:22px}
.fr-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 17px/1 var(--font-disp);flex:none}
.fr-me{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:12px}

.fr-code{font:800 28px/1.1 var(--font-mono);letter-spacing:.14em;color:var(--gold-t)}
.fr-mebtn{display:flex;gap:8px;flex-wrap:wrap}
.fr-add{display:flex;gap:8px}
.fr-add input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:700 16px var(--font-mono);letter-spacing:.14em;text-transform:uppercase}
.fr-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fr-row:last-child{border:0}
.fr-id{display:grid;gap:1px;min-width:0;flex:1 1 130px}
.fr-id b{display:flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.fr-id small{color:var(--muted);font-weight:700}
.fr-id small.on{color:var(--green)}
.fr-row .btn{padding:8px 12px;font-size:13px;position:relative}
.udot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#e53935;box-shadow:0 0 0 2px var(--panel)}
.linkb{border:0;background:transparent;color:var(--green);font:800 inherit;text-decoration:underline;padding:0}
.fr-chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}

<script>
(()=>{
'use strict';
/*ENGINE_START*/

const FILES='abcdefgh';
const MATE=30000, INF=1e6;
const VAL={p:100,n:320,b:330,r:500,q:900,k:0};
const sqName=i=>FILES[i&7]+(8-(i>>3));
const sqIdx=n=>(8-(+n[1]))*8+FILES.indexOf(n[0]);
const NR=[-2,-2,-1,-1,1,1,2,2],NC=[-1,1,-2,2,-2,2,-1,1];
const KR=[-1,-1,-1,0,0,1,1,1],KC=[-1,0,1,-1,1,-1,0,1];
const BR=[-1,-1,1,1],BC=[-1,1,-1,1],RR=[-1,1,0,0],RC=[0,0,-1,1];
const QR=BR.concat(RR),QC=BC.concat(RC);

const PST={
p:[0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
n:[-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
b:[-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
r:[0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
q:[-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20]
};
const KM=[-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20];
const KE=[-50,-40,-30,-20,-20,-30,-40,-50, -30,-20,-10,0,0,-10,-20,-30, -30,-10,20,30,30,20,-10,-30, -30,-10,30,40,40,30,-10,-30, -30,-10,30,40,40,30,-10,-30, -30,-10,20,30,30,20,-10,-30, -30,-30,0,0,0,0,-30,-30, -50,-30,-30,-30,-30,-30,-30,-50];

function startState(){
  const rows=['rnbqkbnr','pppppppp','........','........','........','........','PPPPPPPP','RNBQKBNR'];
  const b=[];
  for(const r of rows) for(const ch of r) b.push(ch==='.'?0:ch);
  return {b,turn:'w',c:15,ep:-1,half:0,full:1,wk:60,bk:4};
}

function attacked(b,sq,by){
  const r=sq>>3,c=sq&7,W=by==='w';
  const P=W?'P':'p',N=W?'N':'n',K=W?'K':'k',B=W?'B':'b',R=W?'R':'r',Q=W?'Q':'q';
  const pr=r+(W?1:-1);
  if(pr>=0&&pr<8){
    if(c>0&&b[pr*8+c-1]===P) return true;
    if(c<7&&b[pr*8+c+1]===P) return true;
  }
  for(let i=0;i<8;i++){
    let rr=r+NR[i],cc=c+NC[i];
    if(rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]===N) return true;
    rr=r+KR[i];cc=c+KC[i];
    if(rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]===K) return true;
  }
  for(let i=0;i<4;i++){
    let rr=r+BR[i],cc=c+BC[i];
    while(rr>=0&&rr<8&&cc>=0&&cc<8){
      const x=b[rr*8+cc];
      if(x){ if(x===B||x===Q) return true; break; }
      rr+=BR[i];cc+=BC[i];
    }
    rr=r+RR[i];cc=c+RC[i];
    while(rr>=0&&rr<8&&cc>=0&&cc<8){
      const x=b[rr*8+cc];
      if(x){ if(x===R||x===Q) return true; break; }
      rr+=RR[i];cc+=RC[i];
    }
  }
  return false;
}

function addPromo(out,from,to,cap,queenOnly){
  const list=queenOnly?['q']:['q','r','b','n'];
  for(const pr of list) out.push({from,to,cap,promo:pr});
}

function pseudo(s,capsOnly){
  const b=s.b,W=s.turn==='w',out=[];
  for(let sq=0;sq<64;sq++){
    const p=b[sq];
    if(!p||(p<'a')!==W) continue;
    const r=sq>>3,c=sq&7,t=W?p.toLowerCase():p;
    if(t==='p'){
      const dir=W?-1:1,nr=r+dir,last=W?0:7;
      if(nr<0||nr>7) continue;
      const fwd=nr*8+c;
      if(!b[fwd]){
        if(nr===last) addPromo(out,sq,fwd,0,capsOnly);
        else if(!capsOnly){
          out.push({from:sq,to:fwd,cap:0});
          if(r===(W?6:1)&&!b[fwd+dir*8]) out.push({from:sq,to:fwd+dir*8,cap:0});
        }
      }
      for(let dc=-1;dc<=1;dc+=2){
        const cc=c+dc;
        if(cc<0||cc>7) continue;
        const to=nr*8+cc,x=b[to];
        if(x){
          if((x<'a')!==W){
            if(nr===last) addPromo(out,sq,to,x,capsOnly);
            else out.push({from:sq,to,cap:x});
          }
        } else if(to===s.ep) out.push({from:sq,to,cap:W?'p':'P',ep:1});
      }
      continue;
    }
    if(t==='n'||t==='k'){
      const dr=t==='n'?NR:KR,dc=t==='n'?NC:KC;
      for(let i=0;i<8;i++){
        const rr=r+dr[i],cc=c+dc[i];
        if(rr<0||rr>7||cc<0||cc>7) continue;
        const to=rr*8+cc,x=b[to];
        if(x){ if((x<'a')!==W) out.push({from:sq,to,cap:x}); }
        else if(!capsOnly) out.push({from:sq,to,cap:0});
      }
      if(t==='k'&&!capsOnly){
        if(W&&sq===60){
          if((s.c&1)&&!b[61]&&!b[62]&&b[63]==='R'&&!attacked(b,60,'b')&&!attacked(b,61,'b')) out.push({from:60,to:62,cap:0,cs:1});
          if((s.c&2)&&!b[59]&&!b[58]&&!b[57]&&b[56]==='R'&&!attacked(b,60,'b')&&!attacked(b,59,'b')) out.push({from:60,to:58,cap:0,cs:2});
        } else if(!W&&sq===4){
          if((s.c&4)&&!b[5]&&!b[6]&&b[7]==='r'&&!attacked(b,4,'w')&&!attacked(b,5,'w')) out.push({from:4,to:6,cap:0,cs:1});
          if((s.c&8)&&!b[3]&&!b[2]&&!b[1]&&b[0]==='r'&&!attacked(b,4,'w')&&!attacked(b,3,'w')) out.push({from:4,to:2,cap:0,cs:2});
        }
      }
      continue;
    }
    const DR=t==='b'?BR:t==='r'?RR:QR,DC=t==='b'?BC:t==='r'?RC:QC;
    for(let i=0;i<DR.length;i++){
      let rr=r+DR[i],cc=c+DC[i];
      while(rr>=0&&rr<8&&cc>=0&&cc<8){
        const to=rr*8+cc,x=b[to];
        if(x){ if((x<'a')!==W) out.push({from:sq,to,cap:x}); break; }
        if(!capsOnly) out.push({from:sq,to,cap:0});
        rr+=DR[i];cc+=DC[i];
      }
    }
  }
  return out;
}

function make(s,m){
  const b=s.b.slice(),p=b[m.from],w=p<'a';
  b[m.from]=0;
  if(m.ep) b[m.to+(w?8:-8)]=0;
  b[m.to]=m.promo?(w?m.promo.toUpperCase():m.promo):p;
  if(m.cs===1){ b[m.to-1]=b[m.to+1]; b[m.to+1]=0; }
  else if(m.cs===2){ b[m.to+1]=b[m.to-2]; b[m.to-2]=0; }
  let c=s.c;
  if(p==='K') c&=~3; else if(p==='k') c&=~12;
  const mk=sq=>sq===63?1:sq===56?2:sq===7?4:sq===0?8:0;
  c&=~(mk(m.from)|mk(m.to));
  const pawn=p==='P'||p==='p';
  return {
    b,turn:w?'b':'w',c,
    ep:pawn&&Math.abs(m.to-m.from)===16?(m.from+m.to)>>1:-1,
    half:(pawn||m.cap)?0:s.half+1,
    full:s.full+(w?0:1),
    wk:p==='K'?m.to:s.wk,bk:p==='k'?m.to:s.bk
  };
}

function kingOf(s,color){ return color==='w'?s.wk:s.bk; }
function inCheck(s){ return attacked(s.b,kingOf(s,s.turn),s.turn==='w'?'b':'w'); }

function legal(s,capsOnly){
  const ms=pseudo(s,capsOnly),out=[],me=s.turn,opp=me==='w'?'b':'w';
  for(const m of ms){
    const n=make(s,m);
    if(!attacked(n.b,kingOf(n,me),opp)) out.push(m);
  }
  return out;
}

function key(s){ return s.b.map(x=>x||'.').join('')+s.turn+s.c+s.ep; }

function insufficient(s){
  const minors=[];
  for(let i=0;i<64;i++){
    const p=s.b[i];
    if(!p) continue;
    const t=p.toLowerCase();
    if(t==='k') continue;
    if(t==='p'||t==='r'||t==='q') return false;
    minors.push([t,((i>>3)+(i&7))&1]);
  }
  if(minors.length<=1) return true;
  return minors.every(m=>m[0]==='b')&&minors.every(m=>m[1]===minors[0][1]);
}

function hasMatingMaterial(s,color){
  let minors=0;
  for(let i=0;i<64;i++){
    const p=s.b[i];
    if(!p||(p<'a')!==(color==='w')) continue;
    const t=p.toLowerCase();
    if(t==='p'||t==='r'||t==='q') return true;
    if(t==='n'||t==='b') minors++;
  }
  return minors>=2;
}

function toSAN(s,m,lm){
  const p=s.b[m.from],t=p.toLowerCase();
  let str;
  if(m.cs) str=m.cs===1?'O-O':'O-O-O';
  else{
    const isCap=!!s.b[m.to]||!!m.ep;
    if(t==='p'){
      str=isCap?FILES[m.from&7]+'x':'';
      str+=sqName(m.to);
      if(m.promo) str+='='+m.promo.toUpperCase();
    } else {
      str=t.toUpperCase();
      const others=lm.filter(o=>!(o.from===m.from&&o.to===m.to)&&o.to===m.to&&s.b[o.from]===p);
      if(others.length){
        const sameFile=others.some(o=>(o.from&7)===(m.from&7));
        const sameRank=others.some(o=>(o.from>>3)===(m.from>>3));
        if(!sameFile) str+=FILES[m.from&7];
        else if(!sameRank) str+=String(8-(m.from>>3));
        else str+=sqName(m.from);
      }
      if(isCap) str+='x';
      str+=sqName(m.to);
    }
  }
  const n=make(s,m);
  if(inCheck(n)) str+=legal(n).length?'+':'#';
  return str;
}

function fen(s){
  const rows=[];
  for(let r=0;r<8;r++){
    let e=0,str='';
    for(let c=0;c<8;c++){
      const p=s.b[r*8+c];
      if(!p) e++; else { if(e){str+=e;e=0;} str+=p; }
    }
    if(e) str+=e;
    rows.push(str);
  }
  const cs=(s.c&1?'K':'')+(s.c&2?'Q':'')+(s.c&4?'k':'')+(s.c&8?'q':'');
  return rows.join('/')+' '+s.turn+' '+(cs||'-')+' '+(s.ep>=0?sqName(s.ep):'-')+' '+s.half+' '+s.full;
}

function evaluate(s){
  const b=s.b;
  let sc=0,np=0,wb=0,bb=0;
  for(let i=0;i<64;i++){
    const p=b[i];
    if(!p) continue;
    const w=p<'a',t=w?p.toLowerCase():p;
    if(t==='k') continue;
    if(t!=='p') np+=VAL[t];
    if(t==='b'){ if(w) wb++; else bb++; }
    const v=VAL[t]+PST[t][w?i:i^56];
    sc+=w?v:-v;
  }
  if(wb>1) sc+=30;
  if(bb>1) sc-=30;
  const kt=np<=2600?KE:KM;
  sc+=kt[s.wk]-kt[s.bk^56];
  return s.turn==='w'?sc:-sc;
}

function orderMoves(s,ms){
  for(const m of ms){
    let o=0;
    if(m.cap){
      const t=s.b[m.from];
      o=10000+10*VAL[m.cap.toLowerCase()]-VAL[t.toLowerCase()];
    }
    if(m.promo) o+=9000+VAL[m.promo];
    m._o=o;
  }
  ms.sort((a,b)=>b._o-a._o);
}

const TIMEOUT={timeout:true};
let nodes=0,deadline=0;

function quiesce(s,alpha,beta,ply){
  if((++nodes&1023)===0&&performance.now()>deadline) throw TIMEOUT;
  const stand=evaluate(s);
  if(ply>18) return stand;
  if(stand>=beta) return beta;
  if(stand>alpha) alpha=stand;
  const me=s.turn,opp=me==='w'?'b':'w';
  const ms=pseudo(s,true);
  orderMoves(s,ms);
  for(let i=0;i<ms.length;i++){
    const n=make(s,ms[i]);
    if(attacked(n.b,kingOf(n,me),opp)) continue;
    const sc=-quiesce(n,-beta,-alpha,ply+1);
    if(sc>=beta) return beta;
    if(sc>alpha) alpha=sc;
  }
  return alpha;
}

function search(s,depth,alpha,beta,ply){
  if((++nodes&1023)===0&&performance.now()>deadline) throw TIMEOUT;
  if(s.half>=100) return 0;
  const me=s.turn,opp=me==='w'?'b':'w';
  const inChk=attacked(s.b,kingOf(s,me),opp);
  if(inChk&&ply<10) depth++;
  if(depth<=0) return quiesce(s,alpha,beta,ply);
  const ms=pseudo(s,false);
  orderMoves(s,ms);
  let count=0;
  for(let i=0;i<ms.length;i++){
    const n=make(s,ms[i]);
    if(attacked(n.b,kingOf(n,me),opp)) continue;
    count++;
    const sc=-search(n,depth-1,-beta,-alpha,ply+1);
    if(sc>=beta) return beta;
    if(sc>alpha) alpha=sc;
  }
  if(!count) return inChk?-MATE+ply:0;
  return alpha;
}

const LV=[null,
  {name:'Rookie',elo:400,depth:1,noise:220,rnd:.3,time:200},
  {name:'Casual',elo:900,depth:2,noise:70,rnd:.08,time:400},
  {name:'Club',elo:1400,depth:3,time:1000},
  {name:'Expert',elo:1900,depth:5,time:2200},
  {name:'Master',elo:2300,depth:8,time:4500},
  {name:'Grandmaster',elo:2500,depth:10,time:7000},
  {name:'Titan',elo:2700,depth:14,time:12000}
];

function findBest(s,level,keys,timeMs){
  const cfg=LV[level],moves=legal(s);
  if(!moves.length) return null;
  if(moves.length===1) return moves[0];
  if(cfg.rnd&&Math.random()<cfg.rnd) return moves[(Math.random()*moves.length)|0];
  nodes=0;
  deadline=performance.now()+(timeMs||cfg.time);
  orderMoves(s,moves);
  const adjust=(sc,n)=>{
    if(!keys||!keys.length) return sc;
    const k=key(n);
    let c=0;
    for(const x of keys) if(x===k) c++;
    if(c>=2) return 0;
    if(c===1&&sc>120) return sc-70;
    return sc;
  };
  if(cfg.noise){
    let best=null,bs=-1e9;
    for(const m of moves){
      const n=make(s,m);
      let sc;
      try{ sc=-search(n,cfg.depth-1,-INF,INF,1); }catch(e){ if(e!==TIMEOUT) throw e; sc=-evaluate(n); }
      sc+=(Math.random()*2-1)*cfg.noise;
      if(sc>bs){bs=sc;best=m;}
    }
    return best;
  }
  let best=moves[0];
  for(let d=1;d<=cfg.depth;d++){
    let alpha=-INF,curBest=null,curScore=-INF;
    try{
      for(let i=0;i<moves.length;i++){
        const n=make(s,moves[i]);
        let sc=-search(n,d-1,-INF,-alpha,1);
        sc=adjust(sc,n);
        if(sc>curScore){curScore=sc;curBest=moves[i];}
        if(sc>alpha) alpha=sc;
      }
    }catch(e){ if(e!==TIMEOUT) throw e; break; }
    best=curBest;
    moves.splice(moves.indexOf(best),1);
    moves.unshift(best);
    if(curScore>MATE-100) break;
  }
  return best;
}

function quickEval(s){
  const lm=legal(s);
  if(!lm.length) return inCheck(s)?(s.turn==='w'?-MATE:MATE):0;
  nodes=0;
  deadline=performance.now()+140;
  let v;
  try{ v=search(s,2,-INF,INF,0); }catch(e){ if(e!==TIMEOUT) throw e; v=evaluate(s); }
  return s.turn==='w'?v:-v;
}

function fromFen(f){
  const parts=f.split(' '),pl=parts[0],t=parts[1],c=parts[2],ep=parts[3];
  const b=[];
  for(const ch of pl){
    if(ch==='/') continue;
    if(ch>='1'&&ch<='8'){ for(let i=0;i<+ch;i++) b.push(0); } else b.push(ch);
  }
  let cc=0;
  if(c.includes('K')) cc|=1;
  if(c.includes('Q')) cc|=2;
  if(c.includes('k')) cc|=4;
  if(c.includes('q')) cc|=8;
  return {b,turn:t,c:cc,ep:ep==='-'?-1:sqIdx(ep),half:+(parts[4]||0),full:+(parts[5]||1),wk:b.indexOf('K'),bk:b.indexOf('k')};
}

/* side to move can force mate within n of its own moves */
function mateIn(s,n){
  const lm=legal(s);
  for(const m of lm){
    const c=make(s,m),cl=legal(c);
    if(!cl.length){ if(inCheck(c)) return true; continue; }
    if(n>1){
      let all=true;
      for(const r of cl){ if(!mateIn(make(c,r),n-1)){ all=false; break; } }
      if(all) return true;
    }
  }
  return false;
}
/* does move m keep a forced mate within n moves? */
function validMove(s,m,n){
  const c=make(s,m),cl=legal(c);
  if(!cl.length) return inCheck(c);
  if(n<=1) return false;
  return cl.every(r=>mateIn(make(c,r),n-1));
}

function winPct(cp){
  cp=Math.max(-1000,Math.min(1000,cp));
  return 50+50*(2/(1+Math.exp(-0.00368208*cp))-1);
}

/* best move and score (side to move's view, centipawns) within a time budget */
function analyze(s,ms){
  const moves=legal(s);
  if(!moves.length) return {move:null,score:inCheck(s)?-MATE:0};
  nodes=0;
  deadline=performance.now()+ms;
  orderMoves(s,moves);
  let best=moves[0],bestScore=-evaluate(make(s,moves[0]));
  for(let d=1;d<=5;d++){
    let alpha=-INF,cb=null,cs=-INF;
    try{
      for(let i=0;i<moves.length;i++){
        const n=make(s,moves[i]);
        const sc=-search(n,d-1,-INF,-alpha,1);
        if(sc>cs){cs=sc;cb=moves[i];}
        if(sc>alpha) alpha=sc;
      }
    }catch(e){ if(e!==TIMEOUT) throw e; break; }
    best=cb;bestScore=cs;
    moves.splice(moves.indexOf(best),1);
    moves.unshift(best);
    if(cs>MATE-100||cs<-MATE+100) break;
  }
  return {move:best,score:bestScore};
}

const cleanSan=a=>a.map(x=>x.replace(/[+#]/g,''));
function openingName(sans){
  const str=cleanSan(sans).join(' ');
  let best=null;
  for(const [name,mv] of OPENINGS) if((str===mv||str.startsWith(mv+' '))&&(!best||mv.length>best.mv.length)) best={name,mv};
  return best?best.name:'';
}
function bookPlies(sans){
  const g=cleanSan(sans);let best=0;
  for(const [,mv] of OPENINGS){
    const e=mv.split(' ');let k=0;
    while(k<e.length&&k<g.length&&e[k]===g[k]) k++;
    if(k>best) best=k;
  }
  return best;
}

function pushMove(g,m){
  const s=g.pos[g.pos.length-1],san=toSAN(s,m,g.legal),n=make(s,m);
  g.pos.push(n);g.moves.push({m,san,cap:m.cap||0,by:s.turn});g.keys.push(key(n));g.legal=legal(n);
}
function sanMove(g,san){
  const s=g.pos[g.pos.length-1],cl=x=>x.replace(/[+#]/g,'');
  return g.legal.find(m=>cl(toSAN(s,m,g.legal))===cl(san))||null;
}
function applySans(g,sans){ for(const x of sans){ const m=sanMove(g,x); if(!m) return false; pushMove(g,m); } return true; }

let actx=null;
function snd(kind){
  if(!prefs.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const cfg={move:[430,.06,'triangle',.12],cap:[210,.10,'square',.07],check:[700,.16,'sawtooth',.05],end:[330,.4,'triangle',.12]}[kind];
    const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type=cfg[2];o.frequency.setValueAtTime(cfg[0],t);
    g.gain.setValueAtTime(cfg[3],t);g.gain.exponentialRampToValueAtTime(0.0001,t+cfg[1]);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+cfg[1]+.03);
  }catch(e){}
}

function say(kind){ if(G.mode==='ai'&&SAY[kind]) setSay(pick(SAY[kind])); }

function canHumanMove(){
  if(!G||G.over||!isLive()||G.thinking||G.pending||G.busy) return false;
  if(page==='community'||page==='other') return false;
  if(G.mode==='online') return !!G.human&&G.started&&OL.joined&&live().turn===G.human;
  if(G.mode==='ai') return G.started&&live().turn===G.human;
  if(G.mode==='local') return G.started;
  return G.mode==='puzzle';
}

function play(m,opts){
  opts=opts||{};
  tickClock();
  const mover=live().turn,wasLive=isLive();
  pushMove(G,m);
  const n=live();
  G.review=null;reviewSeq++;
  if(G.tc&&G.moves.length>1) G.clock[mover]+=G.tc.inc*1000;
  G.running=!!G.tc;G.last=performance.now();
  if(wasLive) G.view=G.pos.length-1;
  G.sel=-1;G.hint=null;G.pending=null;G.flash='';
  $('overlay').hidden=true;
  const chk=inCheck(n);
  snd(chk?'check':(m.cap?'cap':'move'));
  if(G.mode==='ai'){
    const byHuman=mover===G.human;
    if(chk) say(byHuman?'youchk':'botchk');
    else if(m.cap) say(byHuman?'youcap':'botcap');
    else if(Math.random()<.1) say('chat');
  }
  const ended=checkEnd();
  render(opts.animate&&wasLive?{from:m.from,to:m.to}:null);
  fxMove(m,chk,ended,mover);
  if(!ended){ if(G.mode==='ai') maybeAI(); else if(G.mode==='watch') scheduleWatch(); }
}

function checkEnd(){
  const s=live();
  if(G.mode==='online') return olCheckEnd(s);
  if(G.mode==='puzzle') return puzzleAfter();
  if(!G.legal.length){
    if(inCheck(s)) finish(s.turn==='w'?'0-1':'1-0','Checkmate');
    else finish('1/2-1/2','Stalemate');
    return true;
  }
  if(insufficient(s)){ finish('1/2-1/2','Insufficient material'); return true; }
  if(s.half>=100){ finish('1/2-1/2','50-move rule'); return true; }
  const k=G.keys[G.keys.length-1];
  let n=0;
  for(const x of G.keys) if(x===k) n++;
  if(n>=3){ finish('1/2-1/2','Threefold repetition'); return true; }
  return false;
}

function finish(result,reason){
  if(G.over) return;
  G.over=true;G.running=false;G.thinking=false;aiSeq++;
  let title,outcome=.5;
  if(result==='1/2-1/2') title='Draw';
  else if(G.mode==='ai'){
    const won=(result==='1-0')===(G.human==='w');
    title=won?'You Won!':'You Lost';outcome=won?1:0;
  } else if(G.mode==='watch') title=whoFor(G,result==='1-0'?'w':'b').name+' wins';
  else title=(result==='1-0'?'White':'Black')+' wins';
  let sub=reason;
  if(G.mode==='ai'){
    const b=BOTS[G.bot];
    setSay(pick(outcome===1?b.lose:outcome===0?b.win:b.draw));
    if(G.moves.length>0){
      const exp=1/(1+Math.pow(10,(b.rating-prof.rating)/400)),d=Math.round(32*(outcome-exp));
      prof.rating=Math.max(100,prof.rating+d);
      if(outcome===1) prof.w++; else if(outcome===0) prof.l++; else prof.d++;
      persist();
      sub+=' · rating '+prof.rating+' ('+(d>=0?'+':'')+d+')';
    }
  }
  G.ended={title,sub,result};
  coinGameEnd(G,result,outcome);
  archiveGame(G,reason);
  snd('end');
  const g=G;
  setTimeout(()=>{ if(G===g&&g.over&&(page==='play'||page==='watch')) showResult(); },650);
  render();
}
function timeout(color){
  const opp=color==='w'?'b':'w';
  if(!hasMatingMaterial(live(),opp)) finish('1/2-1/2','Timeout, but no mating material');
  else finish(opp==='w'?'1-0':'0-1','Timeout');
}
function tickClock(){
  const now=performance.now();
  if(!G||!G.tc||G.over||!G.running){ if(G) G.last=now; return; }
  const t=live().turn;
  G.clock[t]-=now-G.last;G.last=now;
  if(G.clock[t]<=0){ G.clock[t]=0; if(G.mode!=='online') timeout(t); else olTimeout(t); }
}
setInterval(()=>{ if(!G||page==='community'||page==='other') return; tickClock(); updateClocks(); },100);
function fmt(ms){
  ms=Math.max(0,ms);const s=ms/1000;
  if(s<9.95) return '0:0'+s.toFixed(1);
  const t=Math.ceil(s);
  return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
}

function humanMove(m,opts){

    }

  play(m,opts);
}
function attemptMove(from,to,viaDrag){
  const c=G.legal.filter(m=>m.from===from&&m.to===to);
  if(!c.length){ G.sel=-1; render(); return; }
  if(c.length>1&&c[0].promo){ G.pending={from,to,viaDrag}; showPromo(); return; }
  humanMove(c[0],{animate:!viaDrag});
}
function parseMove(txt){
  const t=txt.trim().replace(/[+#!?]/g,'').replace(/0/g,'O');
  if(!t) return null;
  const lm=G.legal,s=live();
  const sans=lm.map(m=>[m,toSAN(s,m,lm).replace(/[+#]/g,'')]);
  let hit=sans.find(x=>x[1]===t)||sans.find(x=>x[1].toLowerCase()===t.toLowerCase());
  if(hit) return hit[0];
  const u=t.toLowerCase().match(/^([a-h][1-8])-?([a-h][1-8])([qrbn])?$/);
  if(u){
    const f=sqIdx(u[1]),to=sqIdx(u[2]),c=lm.filter(m=>m.from===f&&m.to===to);
    if(c.length) return c.find(m=>m.promo===(u[3]||'q'))||c[0];
  }
  hit=sans.find(x=>x[1].replace('x','').toLowerCase()===t.replace('x','').toLowerCase());
  return hit?hit[0]:null;
}

const BADGE={best:['#81b64c','★'],excellent:['#81b64c','✓'],good:['#7F9A83','✓'],book:['#B98A4A','♦'],inaccuracy:['#D9AE1E','?!'],mistake:['#F08A2E','?'],blunder:['#E5534B','??']};
const LABEL_TEXT={best:'Best',excellent:'Excellent',good:'Good',book:'Book',inaccuracy:'Inaccuracy',mistake:'Mistake',blunder:'Blunder'};
async function startReview(){
  if(G.moves.length<2) return;
  const g=G,token=++reviewSeq;
  g.review={state:'run',done:0,total:g.pos.length,cp:[],best:[],labels:[],acc:null,counts:null};
  renderReview();
  for(let i=0;i<g.pos.length;i++){
    if(G!==g||token!==reviewSeq||!g.review) return;
    const s=g.pos[i],a=analyze(s,i===0?150:220);
    g.review.cp[i]=s.turn==='w'?a.score:-a.score;
    g.review.best[i]=a.move;g.review.done=i+1;
    renderReview();
    await new Promise(r=>setTimeout(r,0));
  }
  if(G!==g||token!==reviewSeq||!g.review) return;
  finishReview(g);render();
}
function finishReview(g){
  const R=g.review,bookN=bookPlies(g.moves.map(x=>x.san));
  const acc={w:[],b:[]},counts={w:{},b:{}};
  for(let i=1;i<g.pos.length;i++){
    const mv=g.moves[i-1],sgn=mv.by==='w'?1:-1;
    const diff=Math.max(0,winPct(sgn*R.cp[i-1])-winPct(sgn*R.cp[i]));
    acc[mv.by].push(Math.max(0,Math.min(100,103.1668*Math.exp(-0.04354*diff)-3.1669)));
    const b=R.best[i-1];
    const isBest=b&&b.from===mv.m.from&&b.to===mv.m.to&&(b.promo||'')===(mv.m.promo||'');
    let lab;
    if(i<=bookN) lab='book';
    else if(diff>=30) lab='blunder';
    else if(diff>=20) lab='mistake';
    else if(diff>=10) lab='inaccuracy';
    else if(isBest) lab='best';
    else if(diff<=3) lab='excellent';
    else lab='good';
    R.labels[i]=lab;counts[mv.by][lab]=(counts[mv.by][lab]||0)+1;
  }
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  R.acc={w:avg(acc.w),b:avg(acc.b)};R.counts=counts;R.state='done';
}
/* ---------- AI Coach: talks (speech synthesis) and types, no microphone ---------- */
const CO={tok:0,timer:0,cid:0,rid:0,lastView:-1,lastRaw:'',keyI:-1,ready:false};
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
const PCN={p:'pawn',n:'knight',b:'bishop',r:'rook',q:'queen',k:'king'};
function spoken(san){

  else{

    s=s.replace(/^([a-h])x/,'$1 takes ').replace('x',' takes ')
      .replace('=Q',' promotes to queen').replace('=R',' promotes to rook').replace('=B',' promotes to bishop').replace('=N',' promotes to knight');
  }
  s=s.replace('+',' check').replace('#',' checkmate').replace(/([a-h])([1-8])/g,'$1 $2');
  return s.replace(/\s+/g,' ').trim();
}
const coRid=R=>R._id||(R._id=++CO.cid);
function coYou(){

}
const coName=c=>{ const y=coYou(); return y===c?'You':whoFor(G,c).name; };
const coBe=n=>n==='You'?'are':'is';
const coSan=(pos,m)=>toSAN(pos,m,legal(pos));

function coachMoveText(i){
  const R=G.review;

  const mv=G.moves[i-1],lab=R.labels[i],by=mv.by,S=coName(by),opp=by==='w'?'b':'w',O=coName(opp);
  const sgn=by==='w'?1:-1,san='[['+mv.san+']]';
  const before=sgn*R.cp[i-1],after=sgn*R.cp[i],d=before-after;

  const mateNow=Math.abs(R.cp[i])>=MATE-200,mateBefore=Math.abs(R.cp[i-1])>=MATE-200;

  if(mv.san.endsWith('#')) return pick(['Checkmate! '+san+' ends the game.',S+' delivered checkmate with '+san+'. Beautifully done.']);
  if(lab==='book'){

  } else if(lab==='good'){

  } else {

    t=S+' played '+san+', and I think that is '+word+'.';
    const nb=R.best[i];
    if(mateNow&&after<0) t+=' It allows a forced checkmate.';

    else if(nb&&nb.cap&&VAL[nb.cap.toLowerCase()]>=300&&i<G.pos.length) t+=' It lets '+O+' win a '+PCN[nb.cap.toLowerCase()]+' with [['+coSan(G.pos[i],nb)+']].';
    else if(b&&b.cap&&!mv.cap&&VAL[b.cap.toLowerCase()]>=300) t+=' There was a chance to win a '+PCN[b.cap.toLowerCase()]+' with '+bs+'.';
    else if(b&&!isBest) t+=' '+bs+' was more accurate.';
    if(!mateNow&&!mateBefore){
      const pw=Math.round(d/100);

  }
  if(lab!=='book'&&!mateNow){

function coachSummary(){
  const R=G.review,wn=whoFor(G,'w').name,bn=whoFor(G,'b').name,you=coYou();
  let t='Let\'s go over '+wn+' versus '+bn+'.';
  const res=G.ended&&G.ended.result;
  if(res==='1-0') t+=' '+coName('w')+' won this game.';
  else if(res==='0-1') t+=' '+coName('b')+' won this game.';
  else if(res==='1/2-1/2') t+=' The game ended in a draw.';
  const nm=openingName(G.moves.map(x=>x.san));
  if(nm) t+=' The opening was the '+nm+'.';
  t+=' '+(coName('w')==='You'?'You':wn)+' played with '+Math.round(R.acc.w)+' percent accuracy, and '+(coName('b')==='You'?'you':bn)+' with '+Math.round(R.acc.b)+' percent.';
  const cnt=c=>({bl:R.counts[c].blunder||0,mi:R.counts[c].mistake||0});
  const parts=['w','b'].filter(c=>!you||c===you).map(c=>{ const x=cnt(c); return coName(c)+' made '+x.bl+(x.bl===1?' blunder':' blunders')+' and '+x.mi+(x.mi===1?' mistake':' mistakes')+'.'; });
  t+=' '+parts.join(' ');
  const km=coachKey();
  if(km.length){
    const w=km.slice().sort((a,b)=>b.d-a.d)[0],mv=G.moves[w.i-1];
    t+=' The turning point was move '+Math.ceil(w.i/2)+', when '+coName(mv.by)+' played [['+mv.san+']].';
  } else t+=' I could not find any big mistakes. A clean game.';
  t+=' Use the buttons below to step through the key moments, or ask me about any move.';
  return t;
}
function coachKey(){
  const R=G.review,out=[];
  for(let i=1;i<G.pos.length;i++){
    const lab=R.labels[i]; if(lab!=='mistake'&&lab!=='blunder') continue;
    const sgn=G.moves[i-1].by==='w'?1:-1;
    out.push({i,d:sgn*(R.cp[i-1]-R.cp[i])});
  }

}
function coachWeak(){
  const R=G.review,you=coYou(),cols=you?[you]:['w','b'],ph={opening:0,middlegame:0,endgame:0};

    if(!cols.includes(G.moves[i-1].by)) continue;
    const lab=R.labels[i]; if(lab!=='mistake'&&lab!=='blunder') continue;
    any++;
    const pcs=G.pos[i].b.filter(x=>x&&!'pPkK'.includes(x)).length;
    ph[i<=20?'opening':(pcs<=6?'endgame':'middlegame')]++;
  }
  const S=you?'Your':'Their';
  if(!any) return 'I do not see any real mistakes here. '+S+' play was clean. Keep it up.';
  const top=Object.keys(ph).sort((a,b)=>ph[b]-ph[a])[0];
  const tip={opening:'Stick to the basics: develop your pieces, control the center and castle early.',middlegame:'Before every move, ask what your opponent can capture or attack next.',endgame:'Practice king activity and passed pawns in simple endings.'}[top];
  return S+' biggest weak spot in this game was the '+top+', with '+ph[top]+(ph[top]===1?' serious error':' serious errors')+'. '+tip;
}
function coachEval(){

  if(pw<.4) return 'The position is roughly equal.';

function coachSay(raw){
  coachStop();
  CO.lastRaw=raw;
  const tok=CO.tok,bub=$('coText');
  const typed=s=>s.replace(/\[\[(.+?)\]\]/g,'$1');
  const talk=s=>s.replace(/\[\[(.+?)\]\]/g,(m,x)=>spoken(x)).replace(/%/g,' percent');
  const parts=(raw.match(/[\s\S]+?(?:[.!?](?=\s|$)|$)/g)||[]).map(s=>s.trim()).filter(Boolean);
  const voiceOn=!!synth&&prefs.coachVoice!==false,rate=+prefs.coachRate||1,cps=voiceOn?16*rate:45;
  bub.textContent='';bub.classList.add('typing');coachSetSpeaking(true);
  let shown='';
  const run=i=>{
    if(tok!==CO.tok) return;
    if(i>=parts.length){ bub.classList.remove('typing'); coachSetSpeaking(false); return; }
    const t=typed(parts[i]),base=shown?shown+' ':'';
    let spDone=!voiceOn,tyDone=false,started=false,adv=false;
    const check=()=>{
      if(adv||tok!==CO.tok||!(spDone&&tyDone)) return;
      adv=true; shown=base+t; setTimeout(()=>run(i+1),voiceOn?100:220);
    };
    if(voiceOn){
      try{
        const u=new SpeechSynthesisUtterance(talk(parts[i])),v=coachVoice();
        if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-US';
        u.rate=rate; u.pitch=1.02;
        u.onstart=()=>{ started=true; };
        u.onend=()=>{ spDone=true; check(); };
        u.onerror=()=>{ spDone=true; check(); };
        try{ synth.resume(); }catch(e){}
        synth.speak(u);
        setTimeout(()=>{ if(!started&&!synth.speaking&&!synth.pending){ spDone=true; check(); } },2200);
      }catch(e){ spDone=true; }
    }
    const t0=performance.now();
    clearInterval(CO.timer);
    CO.timer=setInterval(()=>{
      if(tok!==CO.tok){ clearInterval(CO.timer); return; }
      const n=Math.min(t.length,Math.floor((performance.now()-t0)/1000*cps));
      bub.textContent=base+t.slice(0,n); bub.scrollTop=bub.scrollHeight;
      if(n>=t.length){ clearInterval(CO.timer); tyDone=true; check(); }
    },35);
  };
  run(0);
}

/* ---------- Pointer handling ---------- */
const boardEl=$('board');
function sqFromPoint(x,y){
  const el=document.elementFromPoint(x,y),sq=el&&el.closest?el.closest('[data-sq]'):null;
  return sq&&boardEl.contains(sq)?+sq.dataset.sq:-1;
}
boardEl.addEventListener('contextmenu',e=>e.preventDefault());
boardEl.addEventListener('pointerdown',e=>{
  if(e.button>0||!canHumanMove()) return;
  const sq=sqFromPoint(e.clientX,e.clientY);
  if(sq<0) return;
  const s=live();
  if(G.sel>=0&&G.sel!==sq&&G.legal.some(m=>m.from===G.sel&&m.to===sq)){ attemptMove(G.sel,sq,false); return; }
  const p=s.b[sq];
  if(p&&(p<'a')===(s.turn==='w')){
    const was=G.sel===sq;
    G.sel=sq;G.hint=null;renderBoard();
    G.drag={from:sq,x:e.clientX,y:e.clientY,moved:false,was,ghost:null,size:0};
  } else { G.sel=-1; renderBoard(); }
});
window.addEventListener('pointermove',e=>{
  const d=G&&G.drag;
  if(!d) return;
  if(!d.moved&&Math.hypot(e.clientX-d.x,e.clientY-d.y)>6){
    d.moved=true;
    const src=boardEl.querySelector('[data-sq="'+d.from+'"] .pc');
    if(src){
      const r=src.getBoundingClientRect(),g=document.createElement('div');
      g.className='ghost';g.style.width=g.style.height=r.width+'px';
      g.appendChild(src.cloneNode(true));document.body.appendChild(g);
      d.ghost=g;d.size=r.width;src.classList.add('dragging');
    }
  }
  if(d.ghost) d.ghost.style.transform='translate('+(e.clientX-d.size/2)+'px,'+(e.clientY-d.size/2)+'px)';
});
function endDrag(e,cancel){
  const d=G&&G.drag;
  if(!d) return;
  G.drag=null;
  if(d.ghost) d.ghost.remove();
  if(d.moved){
    const to=cancel?-1:sqFromPoint(e.clientX,e.clientY);
    if(to>=0&&to!==d.from&&G.legal.some(m=>m.from===d.from&&m.to===to)) attemptMove(d.from,to,true);
    else renderBoard();
  } else if(d.was){ G.sel=-1; renderBoard(); }
}

/* evaluation */
function scheduleEval(){
  if($('evalbar').hidden&&page!=='train') return;
  const idx=G.view,g=G;
  if(g.evals[idx]!==undefined){ showEval(g.evals[idx]); return; }
  setTimeout(()=>{
    if(G!==g||g.view!==idx||!g.pos[idx]) return;
    g.evals[idx]=quickEval(g.pos[idx]);
    showEval(g.evals[idx]);
  },60);
}
function showEval(cp){
  const p=1/(1+Math.exp(-cp/280));
  $('evFill').style.height=(p*100).toFixed(1)+'%';
  $('evalNum').textContent=Math.abs(cp)>=MATE-200?(cp>0?'White mates':'Black mates'):((cp>0?'+':'')+(cp/100).toFixed(1));
}

function cardBrand(num){
  const n=num.replace(/\s/g,'');
  if(/^4/.test(n)) return 'VISA';
  if(/^5[1-5]/.test(n)||/^2[2-7]/.test(n)) return 'Mastercard';
  if(/^6/.test(n)) return 'RuPay';
  return 'CARD';
}

function luhn(s){let t=0,d=false;for(let i=s.length-1;i>=0;i--){let n=+s[i];if(d){n*=2;if(n>9)n-=9;}t+=n;d=!d;}return t%10===0;}
function payErrors(){
  const e={};
  if(payMethod==='card'){
    const n=$('pcNum').value.replace(/\s/g,''),x=$('pcExp').value,c=$('pcCvv').value;
    if(n.length!==16||!luhn(n)) e.num='Enter a valid 16-digit card number.';
    const mm=+x.slice(0,2),yy=2000+(+x.slice(3,5)),now=new Date();
    if(!/^\d\d\/\d\d$/.test(x)||mm<1||mm>12) e.exp='Use MM/YY format.';
    else if(yy<now.getFullYear()||(yy===now.getFullYear()&&mm<now.getMonth()+1)) e.exp='This card has expired.';
    if(c.length<3) e.cvv='Enter 3 or 4 digits.';
    if($('pcName').value.trim().length<2) e.name='Enter the name on the card.';
  } else if(payMethod==='upi'){
    if(!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test($('puId').value.trim())) e.upi='Enter a valid UPI ID (e.g. name@bank).';
  } else if(payBankIdx<0) e.bank='Select a bank.';
  return e;
}

function runCard3DS(declined,plan,method,amount){
  const brand=cardBrand(payCardData.num);
  const last4=(payCardData.num.replace(/\s/g,'')||'0000').slice(-4);
  const mobile='+91 ••••••'+(1000+Math.floor(Math.random()*9000));
  const correctOtp=String(100000+Math.floor(Math.random()*900000));
  let otpLeft=120,resendLeft=0,tries=0,otpTimer=null,resendTimer=null;
  const smsIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';

  function render3DS(){
    openModal('<div class="pay-state"><h2 style="margin:0">Bank verification</h2><p class="note" style="margin:0">Complete 3-D Secure to confirm this payment</p></div>'+
      '<div class="tds-box"><div class="tds-head"><div class="bank">'+brand.slice(0,2)+'</div><div><b style="font-size:15px">'+brand+' Secure</b><div class="note" style="margin:0">Card ending '+last4+'</div></div></div>'+
      '<div class="row note" style="display:flex;justify-content:space-between"><span>Merchant</span><b>SRB+ Chess</b></div>'+
      '<div class="row note" style="display:flex;justify-content:space-between"><span>Amount</span><b>'+inr(amount)+'</b></div>'+
      '<div class="tds-sent" id="tdsSent">'+smsIcon+' OTP sent to '+mobile+'</div>'+
      '<p class="note" style="margin:0">Enter the 6-digit OTP</p>'+
      '<div class="tds-otp" id="tdsOtp">'+[0,1,2,3,4,5].map(i=>'<input maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-i="'+i+'" aria-label="Digit '+(i+1)+'">').join('')+'</div>'+
      '<p class="tds-err" id="tdsErr"></p>'+
      '<div class="tds-meta"><span id="tdsCountdown">OTP expires in 2:00</span><button type="button" id="tdsResend" disabled>Resend OTP</button></div>'+
      '<button class="cta sm" id="tdsSubmit">Verify &amp; pay</button>'+
      '<button type="button" class="bio-alt" id="tdsBio">Use fingerprint / Face ID instead</button>'+
      '<p class="pay-hint" style="text-align:center">Demo: use OTP <button type="button" id="tdsFill">'+correctOtp+'</button> · <b>000000</b> fails</p></div>');
    wire3DS();
  }

  function fmtSec(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

  function wire3DS(){
    const inputs=[...document.querySelectorAll('#tdsOtp input')];
    const errEl=$('tdsErr');
    const cdEl=$('tdsCountdown');
    const resendBtn=$('tdsResend');
    const submitBtn=$('tdsSubmit');

    function readOtp(){ return inputs.map(i=>i.value).join(''); }
    function clearOtp(shake){
      inputs.forEach(i=>{i.value='';if(shake){i.classList.remove('err');void i.offsetWidth;i.classList.add('err');}});
      if(shake) setTimeout(()=>inputs.forEach(i=>i.classList.remove('err')),400);
      inputs[0].focus();
    }
    function fillOtp(code){
      const digits=String(code).replace(/\D/g,'').slice(0,6).split('');
      inputs.forEach((inp,i)=>{inp.value=digits[i]||'';});
      if(digits.length===6) inputs[5].focus(); else if(digits.length) inputs[digits.length].focus();
    }

    inputs.forEach((inp,i)=>{
      inp.addEventListener('input',e=>{
        const v=e.target.value.replace(/\D/g,'');
        if(v.length>1){ fillOtp(v); errEl.textContent=''; if(readOtp().length===6) setTimeout(doVerify,80); return; }
        inp.value=v.slice(0,1);
        errEl.textContent='';
        if(inp.value&&i<5) inputs[i+1].focus();
        if(readOtp().length===6) setTimeout(doVerify,80);
      });
      inp.addEventListener('keydown',e=>{
        if(e.key==='Backspace'&&!inp.value&&i>0){ inputs[i-1].focus(); e.preventDefault(); }
        if(e.key==='Enter') doVerify();
      });
      inp.addEventListener('paste',e=>{
        e.preventDefault();
        const t=(e.clipboardData||window.clipboardData).getData('text')||'';
        fillOtp(t); errEl.textContent='';
        if(readOtp().length===6) setTimeout(doVerify,80);
      });
    });

    function tickOtp(){
      otpLeft--;
      if(cdEl) cdEl.textContent=otpLeft>0?('OTP expires in '+fmtSec(otpLeft)):'OTP expired — resend to continue';
      if(otpLeft<=0){ clearInterval(otpTimer); otpTimer=null; if(resendBtn){ resendBtn.disabled=false; resendBtn.textContent='Resend OTP'; } }
    }
    otpTimer=setInterval(tickOtp,1000);

    function startResendCooldown(){
      resendLeft=30;
      resendBtn.disabled=true;
      resendBtn.textContent='Resend in 0:'+String(resendLeft).padStart(2,'0');
      clearInterval(resendTimer);
      resendTimer=setInterval(()=>{
        resendLeft--;
        if(resendLeft<=0){ clearInterval(resendTimer); resendTimer=null; resendBtn.disabled=false; resendBtn.textContent='Resend OTP'; }
        else resendBtn.textContent='Resend in 0:'+String(resendLeft).padStart(2,'0');
      },1000);
    }
    startResendCooldown();

    resendBtn.onclick=()=>{
      if(resendLeft>0) return;
      otpLeft=120;
      clearInterval(otpTimer);
      otpTimer=setInterval(tickOtp,1000);
      if(cdEl) cdEl.textContent='OTP expires in '+fmtSec(otpLeft);
      const sent=$('tdsSent');
      if(sent){ sent.innerHTML=smsIcon+' New OTP sent to '+mobile; }
      clearOtp(false);
      errEl.textContent='';
      startResendCooldown();
    };

    $('tdsFill').onclick=()=>{ fillOtp(correctOtp); errEl.textContent=''; };
    $('tdsBio').onclick=()=>{
      clearInterval(otpTimer); clearInterval(resendTimer);
      runBiometricAuth({
        plan, method, amount, declined,
        onCancel:()=>{ payBusy=false; render3DS(); }
      });
    };

    function doVerify(){
      if(payBusy) return;
      const code=readOtp();
      if(otpLeft<=0){ errEl.textContent='OTP expired. Tap Resend OTP and try again.'; clearOtp(true); return; }
      if(code.length!==6){ errEl.textContent='Enter the complete 6-digit OTP.'; clearOtp(true); return; }
      const ok=code===correctOtp||code==='123456';
      if(!ok||code==='000000'){
        tries++;
        errEl.textContent=tries>=2?'Too many incorrect attempts. Payment cancelled.':'Incorrect OTP. Please try again.';
        clearOtp(true);
        if(tries>=2){
          clearInterval(otpTimer); clearInterval(resendTimer);
          setTimeout(()=>finishDeclined('3-D Secure failed after multiple incorrect OTPs. No money was taken.'),600);
        }
        return;
      }
      clearInterval(otpTimer); clearInterval(resendTimer);
      payBusy=true;
      submitBtn.disabled=true;
      submitBtn.textContent='Verifying…';
      openModal(showSteps('Authorising payment',['OTP verified','Bank authorisation','Recording payment'],0));
      setTimeout(()=>{ const d=$('modal').querySelector('.dlg'); if(d) d.innerHTML=showSteps('Authorising payment',['OTP verified','Bank authorisation','Recording payment'],1); },900);
      setTimeout(()=>{ const d=$('modal').querySelector('.dlg'); if(d) d.innerHTML=showSteps('Authorising payment',['OTP verified','Bank authorisation','Recording payment'],2); },1800);
      setTimeout(()=>{
        if(declined) finishDeclined('Your bank declined this card after authentication. Please try a different card or method.');
        else finishSuccess(plan,method,amount);
      },2700);
    }
    submitBtn.onclick=doVerify;
    inputs[0].focus();
  }

  render3DS();
}

  let left=45;
  openModal('<div class="pay-state"><div class="pay-spin"></div><h2>Waiting for UPI approval</h2>'+
    '<div class="pay-timer" id="upiTimer">0:'+String(left).padStart(2,'0')+'</div>'+
    '<p class="pay-wait">Open your UPI app and approve the request for <b>'+inr(amount)+'</b></p>'+
    '<div class="upi-apps"><span class="upi-app" style="background:#4285f4">GPay</span><span class="upi-app" style="background:#5f259f">PhonePe</span><span class="upi-app" style="background:#00baf2">Paytm</span></div>'+

      setTimeout(()=>{ const d=$('modal').querySelector('.dlg'); if(d) d.innerHTML=showSteps('Completing payment',['PIN verified','Authorising charge','Recording payment'],2); },1600);
      setTimeout(()=>{
        if(declined) onFail('Payment declined after PIN verification. No money was taken.');
        else onSuccess();
      },2500);
    };

const EL={fen:'',lines:null,busy:false};
function topMoves(s,n,ms){
  const moves=legal(s); if(!moves.length) return [];
  nodes=0; deadline=performance.now()+ms; orderMoves(s,moves);
  let res=moves.map(m=>({m,sc:-evaluate(make(s,m))}));
  res.sort((a,b)=>b.sc-a.sc);
  for(let d=2;d<=6;d++){
    const cur=[];
    try{ for(const r of res) cur.push({m:r.m,sc:-search(make(s,r.m),d-1,-INF,INF,1)}); }
    catch(e){ if(e!==TIMEOUT) throw e; break; }
    cur.sort((a,b)=>b.sc-a.sc); res=cur;
    if(res[0].sc>MATE-100) break;
  }
  return res.slice(0,n);
}
const evText=cp=>Math.abs(cp)>=MATE-200?(cp>0?'Mate for White':'Mate for Black'):((cp>0?'+':'')+(cp/100).toFixed(1));
function bookNext(sans){
  const g=cleanSan(sans), out=new Map();
  for(const [name,mv] of OPENINGS){
    const e=mv.split(' ');
    if(e.length<=g.length) continue;
    let ok=true; for(let k=0;k<g.length;k++) if(e[k]!==g[k]){ ok=false; break; }
    if(!ok) continue;
    const nx=e[g.length]; if(!out.has(nx)) out.set(nx,[]);
    out.get(nx).push(name);
  }
  return [...out].map(([san,names])=>({san,names}));
}

const ARC_KEY='srb-archive-v1', ARC_MAX=200, ARC_FREE=3;
function arcLoad(){ try{ const a=JSON.parse(localStorage.getItem(ARC_KEY)); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function arcSave(a){ try{ localStorage.setItem(ARC_KEY,JSON.stringify(a)); }catch(e){} }
function archiveGame(g,reason){
  try{
    if(!g||g.archived||!g.ended||g.moves.length<2||!(g.mode==='ai'||g.mode==='local'||g.mode==='online')) return;
    g.archived=true;
    const a=arcLoad();
    a.unshift({t:Date.now(),mode:g.mode,w:whoFor(g,'w').name,b:whoFor(g,'b').name,
      me:(g.human&&g.mode!=='local')?g.human:null,bot:g.mode==='ai'?g.bot:null,res:g.ended.result,why:reason||'',
      open:openingName(g.moves.map(x=>x.san)),rt:g.mode==='ai'?prof.rating:null,
      mv:g.moves.map(x=>x.m.from+'-'+x.m.to+(x.m.promo||'')).join(' ')});
    if(a.length>ARC_MAX) a.length=ARC_MAX;
    arcSave(a);
  }catch(e){}
}
function arcOutcome(e){
  if(!e.me) return null;
  if(e.res==='1/2-1/2') return 'D';
  if(e.res!=='1-0'&&e.res!=='0-1') return null;
  return ((e.res==='1-0')===(e.me==='w'))?'W':'L';
}
function entryGame(e){
  const g=blankGame(startState(),{mode:'review',names:{w:{name:e.w,av:kingAv('w')},b:{name:e.b,av:kingAv('b')}},orient:e.me||'w'});
  for(const tok of String(e.mv||'').split(' ')){
    const m=/^(\d+)-(\d+)([a-z]?)$/.exec(tok); if(!m) break;
    const mv=g.legal.find(l=>l.from===+m[1]&&l.to===+m[2]&&(l.promo||'')===m[3]);
    if(!mv) break;
    pushMove(g,mv);

  return g;
}

function fbStateMsg(r,mv){
  const pl=r.players||{}, pres=r.presence||{};
  let you=null;
  if(pl.w&&pl.w.id===CID) you='w'; else if(pl.b&&pl.b.id===CID) you='b';
  FB.color=you;

  const ck=r.clock||{w:0,b:0};
  let w=ck.w||0,b=ck.b||0;
  if(r.status==='playing'&&mv.length>0&&tcClock(r.tc)){
    const el=Math.max(0,fbNow()-(ck.at||fbNow()));

  const rm=r.rematch||{};
  return {t:'state',code:FB.code,you:you||'spec',token:CID,tc:r.tc||'0',status:r.status,players:{w:P('w'),b:P('b')},specs:0,

function fbRoom(s){
  const r=s.val();
  if(!r){ olHandle(FB.last?{t:'closed'}:{t:'error',code:'no_room',msg:'That room does not exist.'}); return; }
  OL.joined=true;
  const mv=[]; s.child('moves').forEach(c=>{ mv.push(c.val()); });
  const pl=r.players||{}, pw=r.presence||{}, rm=r.rematch||{};
  const P=c=>!!(pl[c]&&pw[pl[c].id]);
  const cur={gen:r.gen||0,status:r.status,n:mv.length,draw:r.drawOffer||null,decl:r.drawDecl||0,rm:(rm.w?'w':'')+(rm.b?'b':''),pr:(P('w')?'1':'0')+(P('b')?'1':'0')};
  const prev=FB.last;
  FB.snap=s;
  if(FB.host&&cur.status!=='waiting') fbQuickDone();
  if(!prev||prev.gen!==cur.gen||(prev.status==='waiting'&&cur.status!=='waiting')){
    FB.seen=mv.length; FB.last=cur;
    olHandle(fbStateMsg(r,mv));
    return;
  }
  for(let i=FB.seen;i<mv.length;i++){
    const x=mv[i];
    if(x.by!==FB.color) olHandle({t:'move',n:i+1,by:x.by,from:x.from,to:x.to,promo:x.promo||'',clock:x.clock||null});
  }
  FB.seen=mv.length;
  if(cur.status==='over'&&prev.status!=='over') olHandle({t:'over',result:r.result,reason:r.reason||'',clock:null});
  if(cur.pr!==prev.pr) olHandle({t:'presence',w:P('w'),b:P('b'),specs:0});

    if(cur.draw) olHandle({t:'draw_offer',by:cur.draw});
    else if(cur.decl!==prev.decl) olHandle({t:'draw_declined'});
    else olHandle({t:'draw_offer',by:null});
  }
  if(cur.rm!==prev.rm) olHandle({t:'rematch',rematch:{w:!!rm.w,b:!!rm.b}});
  FB.last=cur;
}

    const k=G.keys[G.keys.length-1]; let n=0;
    for(const x of G.keys) if(x===k) n++;

function olJoinCode(code){

    if(r.status!=='waiting'||(pl.w&&pl.b)){ if(qRetry()) return; olNote('That room is full.'); return; }

/* Matchmaking: one queue per time control. Waiting players keep a fresh entry; anyone arriving claims it. */
function fbQuickFind(filter,cb){
  const q=FB.db.ref('queue/'+FB.qkey);
  q.once('value',snap=>{
    const now=fbNow(),list=[];
    snap.forEach(c=>{ const v=c.val(); if(v&&c.key!==CID&&now-v.at<45000&&filter(c.key)) list.push({id:c.key,at:v.at}); });
    list.sort((a,b)=>a.at-b.at);
    const next=()=>{
      const c=list.shift(); if(!c){ cb(null); return; }
      let got=null;
      q.child(c.id).transaction(cur=>{
        if(cur===null){ got=null; return null; }
        if(fbNow()-cur.at<45000){ got=cur; return null; }
        got=null; return;
      },(err,ok)=>{ if(ok&&got) cb(Object.assign({id:c.id},got)); else next(); },false);
    };
    next();
  },()=>{ FB.qLive=false; olNote('Database refused access. Publish the rules from database.rules.json in Firebase console > Realtime Database > Rules.'); const o=$('overlay'); o.hidden=true; });
}
function fbQuickDone(){
  FB.host=false; OL.quick=false; clearInterval(FB.qTimer);
  if(FB.db&&FB.qkey){ const me=FB.db.ref('queue/'+FB.qkey+'/'+CID); me.onDisconnect().cancel(); me.remove(); }
}
function olQuick(){
  commitName();
  const db=fbDb(); if(!db) return;
  fbLeave(); olClose(true); OL.manual=false;
  OL.quick=true; FB.qLive=true; FB.qkey=qKey(prefs.time); fbWatch();
  olNote('Finding an opponent…'); olShowWaiting();
  fbWhenReady(()=>{ if(!FB.qLive) return;
  fbQuickFind(()=>true,v=>{
    if(!FB.qLive) return;
    if(v){ olNote(''); olJoinCode(v.room); return; }
    const color=prefs.color==='r'?(Math.random()<.5?'w':'b'):prefs.color;
    fbCreateRoom(color,prefs.time,code=>{
      if(!FB.qLive){ db.ref('rooms/'+code).remove(); return; }
      olNote(''); fbAttach(code,color); FB.host=true;
      const me=db.ref('queue/'+FB.qkey+'/'+CID);
      const put=()=>me.set({room:code,at:fbNow()});
      put(); me.onDisconnect().remove();
      clearInterval(FB.qTimer);
      FB.qTimer=setInterval(()=>{
        if(!FB.qLive||!FB.host||FB.code!==code){ clearInterval(FB.qTimer); return; }
        put();
        /* two hosts at once: the larger id yields to the smaller one */
        fbQuickFind(id=>id<CID,v2=>{
          if(!v2||!FB.qLive||!FB.host||FB.code!==code) return;
          const key=FB.qkey;
          clearInterval(FB.qTimer); me.onDisconnect().cancel(); me.remove();
          db.ref('rooms/'+code).remove();
          fbDetach(); FB.qkey=key; FB.qLive=true; OL.quick=true;
          olJoinCode(v2.room);
        });
      },4000);
    });
  });
  });
}
function olEndInfo(g,result,reason){
  let title;
  if(result==='1/2-1/2') title='Draw';
  else if(g.human) title=((result==='1-0')===(g.human==='w'))?'You Won!':'You Lost';
  else title=(result==='1-0'?'White':'Black')+' wins';
  return {title,sub:reason,result};
}
function olShown(g){ return !!g&&G===g&&page==='play'; }

function olHandle(m){
  switch(m.t){
    case 'state': return olState(m);
    case 'move': return olMove(m);
    case 'over': return olOver(m);
    case 'presence': OL.pres={w:m.w,b:m.b,specs:m.specs}; return olRefresh();
    case 'draw_offer': OL.drawBy=m.by; return olRefresh();
    case 'draw_declined': OL.drawBy=null; olRefresh(); if(OL.game&&olShown(OL.game)) olFlash('Draw offer declined.'); return;
    case 'rematch': OL.rematch=m.rematch; if(OL.game&&OL.game.over&&olShown(OL.game)) olShowResult(); return;
    case 'chat': OL.chat.push({name:m.name,text:m.text}); if(OL.chat.length>40) OL.chat.shift(); return olRefresh();
    case 'closed': return olEnded('The room was closed.');
    case 'error': return olError(m);
  }
}
function olState(m){
  OL.tries=0; OL.joined=true; OL.room=true; OL.code=m.code; OL.you=m.you;
  if(m.token) OL.token=m.token;
  seatSave(); olNote(''); if(m.status!=='waiting') frClearOut();
  OL.drawBy=m.drawOffer||null; OL.rematch=m.rematch||{w:false,b:false};
  OL.pres={w:!!(m.players.w&&m.players.w.online),b:!!(m.players.b&&m.players.b.online),specs:m.specs||0};
  const tc=parseTC(m.tc), human=(m.you==='w'||m.you==='b')?m.you:null;
  const nm=c=>{ const p=m.players[c]; return p?{name:p.name,flag:p.flag,av:kingAv(c)}:{name:'Waiting…',av:kingAv(c)}; };
  const g=blankGame(startState(),{mode:'online',human,orient:human||'w',tc,clock:{w:m.clock.w,b:m.clock.b},started:m.status!=='waiting',names:{w:nm('w'),b:nm('b')}});
  g.online={status:m.status};
  for(const x of m.moves){
    const mv=g.legal.find(l=>l.from===x.from&&l.to===x.to&&(l.promo||'')===(x.promo||''));
    if(!mv){ olSend({t:'sync'}); break; }
    pushMove(g,mv);
  }
  g.view=g.pos.length-1;
  g.running=!!tc&&m.status==='playing'&&g.moves.length>0;
  g.last=performance.now();
  if(m.status==='over'){ g.over=true; g.running=false; g.ended=olEndInfo(g,m.result,m.reason); }
  aiSeq++; reviewSeq++;
  OL.game=g; games.play=g; ui.setup=false;
  if(page==='play'){
    G=g; $('overlay').hidden=true; applyPage(); render();
    if(m.status==='waiting') olShowWaiting();
    else if(m.status==='over') setTimeout(()=>{ if(G===g&&g.over&&page==='play') olShowResult(); },300);
  }
}
function olMove(m){
  const g=OL.game; if(!g||g.over) return;
  if(m.n===g.moves.length+1&&m.by!==g.human){
    const mv=g.legal.find(l=>l.from===m.from&&l.to===m.to&&(l.promo||'')===(m.promo||''));
    if(!mv){ olSend({t:'sync'}); return; }
    if(olShown(g)) play(mv,{animate:true});
    else{ pushMove(g,mv); g.view=g.pos.length-1; }
  } else if(!(m.n===g.moves.length&&m.by===g.human)){ olSend({t:'sync'}); return; }
  if(m.clock){
    g.clock.w=m.clock.w; g.clock.b=m.clock.b; g.last=performance.now();
    g.running=!!g.tc&&g.moves.length>0&&!g.over;
    if(olShown(g)) updateClocks();
  }
  OL.drawBy=null; olRefresh();
}
function olOver(m){
  const g=OL.game; if(!g||g.over) return;
  g.over=true; g.running=false; g.thinking=false; g.ended=olEndInfo(g,m.result,m.reason);
  coinGameEnd(g,m.result,null);
  archiveGame(g,m.reason);
  if(m.clock){ g.clock.w=m.clock.w; g.clock.b=m.clock.b; }
  OL.drawBy=null; OL.rematch={w:false,b:false};
  if(olShown(g)){
    snd('end'); render();
    setTimeout(()=>{ if(G===g&&g.over&&page==='play') olShowResult(); },650);
  }
}
function olEnded(msg){
  const g=OL.game;
  seatClear(); OL.room=false; OL.joined=false; olClose(true);
  if(g&&!g.over){ g.over=true; g.running=false; g.ended={title:'Game closed',sub:msg,result:'*'}; }
  if(g&&olShown(g)){
    render();
    const o=$('overlay');
    o.innerHTML='<div class="modal-card"><h3>Game closed</h3><p>'+esc(msg)+'</p><div style="display:grid;gap:10px;margin-top:4px"><button class="cta sm" data-act="olleave">OK</button></div></div>';
    o.hidden=false;
  }
}
function olError(m){
  if(m.code==='no_room'&&OL.room) return olEnded('This room no longer exists.');
  if(OL.room){ if(m.code!=='not_player'&&m.code!=='not_active') olFlash(m.msg); return; }
  olNote(m.msg); olClose(true);
}

const PROV={google:['Google','google.com'],apple:['Apple','apple.com'],x:['X','twitter.com']};
